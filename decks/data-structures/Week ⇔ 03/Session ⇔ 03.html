<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Structures — Session 03 · Arrays with OOP in C++</title>
<meta name="description" content="Data Structures with C++ — Session 03: Arrays with OOP in C++ by Eng. Muhammad Ali Abdul Kareem, Sinai University.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Lemonada:wght@400;600;700&display=swap" rel="stylesheet">
<script>
  try {
    var t = localStorage.getItem('cs:theme') || localStorage.getItem('deck_theme');
    if (t === 'light') document.documentElement.classList.add('light-mode');
  } catch(e){}


</script>
<style>
:root{
  color-scheme: dark;
  --c:#ec4899; --c-2:#a855f7;
  --c-grad:linear-gradient(90deg,var(--c),var(--c-2));
  
  /* Dark Theme Tokens */
  --bg:#07070d;
  --stage-bg:#090912;
  --card:rgba(18,18,28,.82);
  --card-border:rgba(255,255,255,.08);
  --tp:#f0eeff;
  --ts:#9a9ab5;
  --tm:#6b6b85;
  --warn:#fb7185;
  --syntax-grad:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  
  --cv-board:#0a0a13;
  --cv-grid:rgba(168,85,247,.055);
  --cv-axis:rgba(255,255,255,.25);
  --cv-text-dim:#8a8aa3;
  --cv-text-main:#eef0ff;
  --shadow-vp:0 32px 70px rgba(0,0,0,.8);
}

/* Light Theme Tokens */
html.light-mode, body.light-mode, html.light-mode body{
  color-scheme: light;
  --bg:#ebe9f5;
  --stage-bg:#ffffff;
  --card:#ffffff;
  --card-border:rgba(120,110,160,.16);
  --tp:#181528;
  --ts:#524d70;
  --tm:#7f789e;
  --warn:#e11d48;
  --syntax-grad:linear-gradient(135deg,#4f46e5,#9333ea,#db2777);
  
  --cv-board:#ffffff;
  --cv-grid:rgba(99,102,241,.06);
  --cv-axis:rgba(24,21,40,.2);
  --cv-text-dim:#6d678a;
  --cv-text-main:#181528;
  --shadow-vp:0 24px 60px rgba(100,90,140,.14);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--tp);font-family:Inter,system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;transition:background .3s ease, color .3s ease;}
body{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:flex;align-items:center;justify-content:center}
#fitbox{position:relative;flex:none}
#deck{width:1100px;height:707px;position:absolute;left:0;top:0;transform-origin:top left}

/* Brand Bar */
.brand-bar{height:44px;display:flex;justify-content:space-between;align-items:center}
.brand-left{display:flex;align-items:center;gap:11px}

/* Big-O Speed Pulse Icon */
.brand-icon{
  width:32px; height:32px; border-radius:9px;
  background:var(--syntax-grad); display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(168,85,247,.4); flex-shrink:0;
}
.brand-icon svg{ width:20px; height:20px; fill:none; stroke:#ffffff; stroke-linecap:round; stroke-linejoin:round; }

.brand-name{font-size:15px;font-weight:900;background:var(--syntax-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.brand-sub{font-size:11px;color:var(--tm);font-weight:600}
.brand-right{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--ts);font-weight:700}

/* Theme Toggle Button */
.theme-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--tp);transition:.2s;padding:0;
}
.theme-btn:hover{border-color:var(--c);transform:scale(1.05);}
.theme-btn svg{width:16px;height:16px;stroke-width:2;}

/* Stage Engine */
.vp{
  width:1100px;height:619px;position:relative;border-radius:20px;overflow:hidden;
  border:1px solid var(--card-border);background:var(--stage-bg);box-shadow:var(--shadow-vp);
  transition:background .3s ease, border-color .3s ease, box-shadow .3s ease;
}
.vp.part-intro{--c:#ec4899;--c-2:#a855f7}
.vp.part-classes{--c:#06b6d4;--c-2:#3b82f6}
.vp.part-rules{--c:#8b5cf6;--c-2:#ec4899}
.vp.part-seq{--c:#6366f1;--c-2:#8b5cf6}
.vp.part-sel{--c:#f59e0b;--c-2:#fbbf24}
.vp.part-rep{--c:#22d3ee;--c-2:#06b6d4}
.vp.part-fn{--c:#10b981;--c-2:#34d399}

body.light-mode .vp.part-intro{--c:#db2777;--c-2:#9333ea}
body.light-mode .vp.part-classes{--c:#0284c7;--c-2:#2563eb}
body.light-mode .vp.part-rules{--c:#7c3aed;--c-2:#db2777}
body.light-mode .vp.part-seq{--c:#4f46e5;--c-2:#7c3aed}
body.light-mode .vp.part-sel{--c:#d97706;--c-2:#b45309}
body.light-mode .vp.part-rep{--c:#0891b2;--c-2:#0284c7}
body.light-mode .vp.part-fn{--c:#059669;--c-2:#10b981}

.vp-bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.vp-progress{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(128,128,128,.1);z-index:6}
.vp-progress span{display:block;height:100%;width:0;background:var(--syntax-grad);box-shadow:0 0 12px var(--c);border-radius:0 3px 3px 0;transition:width .45s ease}
.slide-counter{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;
  padding:5px 14px;border-radius:999px;background:var(--card);border:1px solid var(--card-border);
  font-size:12px;font-weight:800;color:var(--ts);box-shadow:0 4px 16px rgba(0,0,0,.08);
}

/* Slide Animation */
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:32px 46px 24px;z-index:2}
.slide.active{display:flex}
.slide>*{animation:revealUp .6s ease both}
.slide>*:nth-child(2){animation-delay:.08s}
.slide>*:nth-child(3){animation-delay:.16s}
.slide>*:nth-child(4){animation-delay:.24s}
.slide>*:nth-child(5){animation-delay:.32s}
@keyframes revealUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.lbl{font-size:11.5px;font-weight:800;color:var(--c);margin-bottom:3px;letter-spacing:.4px;text-transform:uppercase}
h2{margin:0 0 4px;font-size:24px;font-weight:900;line-height:1.2;letter-spacing:-.3px}
h2 em{font-style:normal;background:var(--c-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 4px;font-size:13.5px;color:var(--ts);line-height:1.45;max-width:850px}
.sub strong{color:var(--tp)}
code,pre.code{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
code{font-family:var(--mono);font-size:.92em;color:var(--c);background:rgba(128,128,128,.1);padding:1px 6px;border-radius:6px}

/* Fully Stretched Stage */
.stage{flex:1;position:relative;min-height:0;margin-top:10px;display:flex;flex-direction:column;}
.viz{position:absolute;inset:0}
.viz canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Footer elements */
.sf{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--tm);font-weight:600;margin-top:6px;height:16px;flex-shrink:0;}
.pd{display:flex;gap:4px;align-items:center;max-width:650px;overflow:hidden}
.dot{width:5px;height:5px;border-radius:99px;background:rgba(128,128,128,.2);transition:.3s;flex:none}
.dot.on{width:18px;background:var(--c-grad)}

/* Hero View */
.hero-slide{justify-content:center}
.hero-slide .lbl{margin-top:auto}
.hero-slide h1{margin:6px 0 10px;font-size:62px;line-height:1.05;font-weight:900;letter-spacing:-2px}
.hero-slide h1 em{font-style:normal;background:var(--syntax-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-slide .tag{font-size:20px;color:var(--ts);font-weight:600;max-width:820px;line-height:1.45}
.inst{display:flex;align-items:center;gap:14px;margin-top:26px}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--syntax-grad);display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 0 24px rgba(168,85,247,.35);color:#fff}
.inst small{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--tm);font-weight:800;margin-bottom:2px}
.inst b{font-size:20px;font-weight:800}
.chips{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.chips span{padding:6px 14px;border-radius:999px;border:1px solid var(--card-border);background:var(--card);font-size:12.5px;font-weight:700;color:var(--ts)}
.hero-slide .sf{margin-top:auto}
.herobg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* Split Layouts & Tasks */
.task{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;min-height:0;height:100%;align-items:center;}
.tleft{display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0;overflow-y:auto;padding-right:4px}
.chip{align-self:flex-start;padding:3px 10px;border-radius:999px;background:rgba(128,128,128,.1);border:1px solid var(--card-border);color:var(--c);font-weight:800;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase}
.req{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.req li{position:relative;padding-left:22px;font-size:13px;line-height:1.45;color:var(--tp)}
.req li::before{content:'';position:absolute;left:0;top:.45em;width:8px;height:8px;border-radius:2.5px;background:var(--c-grad)}
.trap{padding:9px 12px;border-radius:10px;border:1px solid rgba(251,113,133,.4);background:rgba(251,113,133,.08);font-size:12px;line-height:1.45;color:var(--tp)}
.trap b{color:var(--warn)}
.key{padding:9px 12px;border-radius:10px;border:1px solid rgba(16,185,129,.45);background:rgba(16,185,129,.08);font-size:12px;line-height:1.45;color:var(--tp)}
.key b{color:#10b981}
body.light-mode .key b{color:#059669}

.tright{position:relative;min-height:0;display:flex;flex-direction:column;justify-content:center;height:100%;}

/* Fit-Content Code Window (No unnecessary giant black boxes) */
.code-window{
  background:#090912; border:1px solid var(--card-border); border-radius:12px;
  overflow:hidden; display:flex; flex-direction:column; width:100%;
  box-shadow:0 16px 40px rgba(0,0,0,.35);
  height:fit-content; max-height:100%; align-self:center;
}
body.light-mode .code-window{
  background:#13111f; border-color:rgba(120,110,160,.18); box-shadow:0 14px 30px rgba(50,40,90,.15);
}
.code-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 14px; background:rgba(255,255,255,.04); border-bottom:1px solid rgba(255,255,255,.07);
  flex-shrink:0;
}
.dots{display:flex; gap:5px;}
.dots span{width:8px; height:8px; border-radius:50%;}
.dots span:nth-child(1){background:#ff5f56;}
.dots span:nth-child(2){background:#ffbd2e;}
.dots span:nth-child(3){background:#27c93f;}
.copy-btn{
  background:transparent; border:1px solid rgba(255,255,255,.15); color:#a5a0c2;
  font:600 10.5px Inter,system-ui; padding:2px 8px; border-radius:5px; cursor:pointer;
  transition:.2s; display:flex; align-items:center; gap:4px;
}
.copy-btn:hover{color:#ffffff; border-color:var(--c); background:rgba(255,255,255,.08);}
.copy-btn.copied{color:#34d399; border-color:#34d399;}

.codecard{
  padding:14px 18px; overflow-x:auto; overflow-y:auto;
}
pre.code{margin:0; font:500 13px/1.55 var(--mono); color:#e8e6ff; white-space:pre; tab-size:4; width:100%;}
pre.code .k{color:#ff79c6; font-weight:700}
pre.code .t{color:#67e8f9}
pre.code .s{color:#34d399}
pre.code .n{color:#fbbf24}
pre.code .c{color:#797599; font-style:italic}
pre.code .p{color:#c084fc}
pre.code .f{color:#93c5fd}
pre.code .o{color:#f472b6}

/* Cards Layout: Center aligned vertically & natural height */
.cards{
  display:grid; gap:20px; width:100%; height:100%;
  grid-template-columns:repeat(2, 1fr); align-items:center;
}
.cc{
  display:flex; flex-direction:column; gap:8px; min-width:0;
  height:fit-content; max-height:100%;
}
.cc-h{font-size:11.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--c); flex-shrink:0;}
.cc .code-window{height:fit-content;}
.cc-n{font-size:12px; line-height:1.45; color:var(--ts); flex-shrink:0; margin-top:2px;}
.cc-n b{color:var(--tp)}

/* Solution Popover */
.sol-actions{display:flex; align-items:center; gap:10px; margin-top:4px;}
.solbtn{
  cursor:pointer; padding:6px 14px; border-radius:999px; border:1px solid var(--c);
  background:var(--card); color:var(--tp); font:800 11.5px Inter,system-ui,sans-serif;
  letter-spacing:.3px; align-self:flex-start; transition:.2s;
}
.solbtn:hover{background:var(--c); color:#ffffff}
.solbtn kbd{margin-left:5px; padding:1px 4px; border-radius:3px; background:rgba(128,128,128,.15); font:700 10px var(--mono)}
.sol{display:none; position:absolute; inset:0; background:var(--stage-bg); padding:30px 44px; z-index:8; flex-direction:column; gap:10px}
.sol.open{display:flex}
.sol-h{display:flex; justify-content:space-between; align-items:center}
.sol-h .lbl{margin:0; font-size:13px}
.sol-body{display:grid; grid-template-columns:1.4fr 1fr; gap:18px; flex:1; min-height:0}
.notes{display:flex; flex-direction:column; gap:8px; justify-content:center}
.note-h{font-size:11px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--tm)}
.note{padding:8px 12px; border-radius:8px; border:1px solid var(--card-border); border-left:3px solid var(--c); background:var(--card); font-size:12.5px; line-height:1.45}

/* MCQ Interactive Challenge Box */
.mcq-box{display:flex; flex-direction:column; gap:10px;}
.mcq-options{display:grid; grid-template-columns:repeat(2, 1fr); gap:9px; margin-top:2px;}
.mcq-btn{
  background:var(--card); border:1px solid var(--card-border);
  border-radius:9px; padding:10px 12px; color:var(--tp); font:700 13px var(--mono);
  cursor:pointer; transition:.2s; text-align:center;
}
.mcq-btn:hover{border-color:var(--c); transform:translateY(-1px);}
.mcq-btn.correct{background:rgba(52,211,153,.18); border-color:#34d399; color:#059669;}
body.light-mode .mcq-btn.correct{color:#047857; background:rgba(52,211,153,.25);}
.mcq-btn.wrong{background:rgba(251,113,133,.18); border-color:#fb7185; color:#e11d48;}
.mcq-feedback{min-height:44px; font-size:12.5px; line-height:1.45; padding:8px 12px; border-radius:9px; display:none;}
.mcq-feedback.show{display:block;}
.mcq-feedback.correct{background:rgba(52,211,153,.08); border:1px solid rgba(52,211,153,.3); color:#059669;}
body.light-mode .mcq-feedback.correct{background:rgba(52,211,153,.14); color:#065f46;}
.mcq-feedback.wrong{background:rgba(251,113,133,.08); border:1px solid rgba(251,113,133,.3); color:#e11d48;}

/* Bottom Controls */
.controls{height:44px; display:flex; align-items:center; justify-content:space-between; color:var(--tm); font-size:12px; font-weight:600}
.controls button{cursor:pointer; padding:6px 14px; border-radius:999px; border:1px solid var(--card-border); background:var(--card); color:var(--ts); font:700 12px Inter,system-ui,sans-serif; transition:.2s}
.controls button:hover{color:var(--tp); border-color:var(--c)}
.controls kbd{padding:1px 6px; border-radius:5px; background:rgba(128,128,128,.14); font:700 11px var(--mono); color:var(--ts)}

.mnav{display:none; position:absolute; top:50%; z-index:9; width:38px; height:38px; margin-top:-19px; border-radius:50%; border:1px solid var(--card-border); background:var(--card); color:var(--tp); font:800 20px/1 Inter,system-ui,sans-serif; cursor:pointer; place-items:center; padding:0; opacity:.85}
.mnav.mp{left:6px}.mnav.mn{right:6px}
.small .mnav{display:grid}
.small .brand-bar,.small .controls{display:none}
.small .vp{border-radius:12px}

.ln{display:block;padding:0 8px;margin:0 -8px;border-radius:5px;transition:background .2s,box-shadow .2s}
.ln.hot{background:rgba(251,191,36,.16);box-shadow:inset 3px 0 0 #fbbf24}
.vizbox{position:relative;flex:1;min-height:0}
.vizbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tright.lab{justify-content:flex-start;gap:8px}
.ctl{display:flex;flex-direction:column;gap:8px;flex-shrink:0;padding:9px 11px;border:1px solid var(--card-border);border-radius:14px;background:var(--card)}
.ctl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--card-border);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ts);font:800 11.5px Inter,system-ui,sans-serif;padding:6px 12px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--c-grad);color:#fff}
.fld{display:none;align-items:center;gap:6px;font:700 11px var(--mono);color:var(--tm)}
.ctl.manual .fld{display:inline-flex}
.fld input{width:58px;padding:5px 8px;border-radius:8px;border:1px solid var(--card-border);background:transparent;color:var(--tp);font:600 12px var(--mono);outline:none}
.fld input.wide{width:92px}
.fld input:focus{border-color:var(--c);box-shadow:0 0 0 3px rgba(168,85,247,.18)}
.runbtn{display:none;cursor:pointer;padding:6px 14px;border-radius:999px;border:0;background:var(--c-grad);color:#fff;font:800 11.5px Inter,system-ui,sans-serif}
.ctl.manual .runbtn{display:inline-block}
.tbtn{min-width:30px;height:27px;border-radius:8px;border:1px solid var(--card-border);background:transparent;color:var(--tp);cursor:pointer;font:700 13px Inter,system-ui,sans-serif;padding:0 8px}
.tbtn:hover{border-color:var(--c)}
.stp{flex:1;min-width:40px;height:5px;border-radius:99px;background:rgba(128,128,160,.22);overflow:hidden}
.stp i{display:block;height:100%;width:0;background:var(--c-grad);transition:width .3s}
.cnt{font:700 11px var(--mono);color:var(--tm);white-space:nowrap}
.dl-btn{padding:4px 9px;border-radius:6px;border:1px solid var(--card-border);background:transparent;color:var(--tp);cursor:pointer;font:600 11px Inter,sans-serif;transition:border-color .2s,background .2s}
.dl-btn:hover{border-color:var(--c);background:rgba(255,255,255,.08)}
.laser-pointer{position:fixed;width:16px;height:16px;border-radius:50%;background:#ff2a55;box-shadow:0 0 14px 5px rgba(255,42,85,.85),0 0 28px 12px rgba(255,42,85,.4);pointer-events:none;z-index:999999;transform:translate(-50%,-50%);display:none}
.laser-pointer.active{display:block}
.laser-pointer::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff}
body.laser-active,body.laser-active *{cursor:none!important}

/* Creative Floating Island Navigation (Mobile HUD) */
.m-nav-hud{display:none}
.small .m-nav-hud{
  display:flex;align-items:center;justify-content:space-between;
  position:fixed;top:max(6px, env(safe-area-inset-top));left:max(8px, env(safe-area-inset-left));right:max(8px, env(safe-area-inset-right));
  z-index:999;pointer-events:none;
}
.small .m-nav-hud>*{pointer-events:auto}

/* The Creative Home Pill */
.m-pill{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;
  background:rgba(12,10,22,.68);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.12);color:#f0eeff;font:700 11px/1 Inter,system-ui,sans-serif;
  text-decoration:none;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);
  transition:transform .15s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease;
  user-select:none;
}
.m-pill:active{transform:scale(0.93)}
.m-pill-home{
  background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.22)),rgba(14,12,24,.75);
  border-color:rgba(168,85,247,.3);
  box-shadow:0 4px 16px rgba(168,85,247,.18),0 2px 6px rgba(0,0,0,.35);
}
.m-pill-home:hover{border-color:var(--c);box-shadow:0 6px 20px rgba(168,85,247,.35)}
.m-pill-home .m-pill-icon svg{width:13px;height:13px;stroke:var(--c);display:block}
.m-pill-home .m-pill-text{font-weight:800;letter-spacing:.2px;background:linear-gradient(90deg,#fff,#f0eeff);-webkit-background-clip:text;background-clip:text;color:transparent}
.m-pill-spark{font-size:9px;color:var(--c);animation:pulseSpark 2.4s ease-in-out infinite}

<script>
'use strict';
let isLight = false;
let CL = {
  indigo:'#6366f1', violet:'#a855f7', pink:'#ec4899', cyan:'#06b6d4', green:'#10b981', amber:'#f59e0b',
  chalk:'#eef0ff', dim:'#8a8aa3', board:'#0a0a13', grid:'rgba(168,85,247,.055)', axis:'rgba(255,255,255,.25)'
};

function updateThemeTokens(){
  isLight = document.body.classList.contains('light-mode');
  if(isLight){
    CL = {
      indigo:'#4f46e5', violet:'#9333ea', pink:'#db2777', cyan:'#0284c7', green:'#059669', amber:'#d97706',
      chalk:'#181528', dim:'#6d678a', board:'#ffffff', grid:'rgba(99,102,241,.06)', axis:'rgba(24,21,40,.2)'
    };
  } else {
    CL = {
      indigo:'#6366f1', violet:'#a855f7', pink:'#ec4899', cyan:'#06b6d4', green:'#10b981', amber:'#f59e0b',
      chalk:'#eef0ff', dim:'#8a8aa3', board:'#0a0a13', grid:'rgba(168,85,247,.055)', axis:'rgba(255,255,255,.25)'
    };
  }
}

const FONTS={ui:'Inter, system-ui, sans-serif',marker:'Lemonada, Inter, sans-serif',mono:'"JetBrains Mono", ui-monospace, Menlo, monospace'};
let PC='#ec4899',PC2='#a855f7',SC=1;
const at=(f,a,b)=>Math.min(1,Math.max(0,(f-a)/(b-a)));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};

function fit(cv){
  const ctx=cv.getContext('2d'),s={ctx,W:0,H:0,d:0},p=cv.parentElement;
  s.rs=()=>{
    const w=p.clientWidth,h=p.clientHeight,d=Math.min((devicePixelRatio||1)*SC,3);
    if(!w||!h||(w===s.W&&h===s.H&&Math.abs(d-s.d)<.01))return;
    s.W=w;s.H=h;s.d=d;cv.width=Math.round(w*d);cv.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);
  };
  s.rs();return s;
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function marker(c,pts,prog,col,lw=2.4){
  if(prog<=0||pts.length<2)return;
  let total=0;const seg=[];
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);total+=d}
  const target=total*prog;c.save();
  c.strokeStyle=col;c.lineWidth=lw;c.lineJoin='round';c.lineCap='round';
  if(!isLight){ c.shadowColor=col; c.shadowBlur=6; }
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);let acc=0;
  for(let i=1;i<pts.length;i++){const d=seg[i-1];
    if(acc+d<=target){c.lineTo(pts[i][0],pts[i][1]);acc+=d}
    else{const r=(target-acc)/d;c.lineTo(pts[i-1][0]+(pts[i][0]-pts[i-1][0])*r,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*r);break}
  }
  c.stroke();c.restore();
}

let CW=0;
function txt(c,s,x,y,o={}){
  const{size=13,col=CL.chalk,weight=700,align='center',a=1,font='ui',base='middle'}=o;
  if(!s||!(a>0))return;
  c.save();c.globalAlpha=a;c.font=`${weight} ${size}px ${FONTS[font]}`;
  const w=c.measureText(s).width;
  let ax=align==='center'?x-w/2:align==='right'?x-w:x;
  if(CW)ax=Math.max(12,Math.min(ax,CW-12-w));
  c.fillStyle=col;c.textAlign='left';c.textBaseline=base;c.fillText(s,ax,y);c.restore();
}
function board(c,W,H,o={}){
  const p=6,x=p,y=p,w=W-p*2,h=H-p*2;
  rr(c,x,y,w,h,16);c.fillStyle=CL.board;c.fill();
  c.save();rr(c,x,y,w,h,16);c.clip();c.fillStyle=CL.grid;
  for(let gx=x+22;gx<x+w;gx+=26)for(let gy=y+22;gy<y+h;gy+=26){c.beginPath();c.arc(gx,gy,1,0,7);c.fill()}
  c.restore();
  const g=c.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,CL.indigo);g.addColorStop(.5,CL.violet);g.addColorStop(1,CL.pink);
  c.save();c.strokeStyle=g;c.lineWidth=isLight?1.5:2;

function table(c,x,y,w,cols,rows,f,o={}){
  const{rowH=40,hdrH=34,start=14,per=55,col=PC}=o;

    cx+=cw});
  marker(c,[[x,y+hdrH],[x+w,y+hdrH]],hp,col,1.6);
  const first=start+30;
  rows.forEach((row,r)=>{
    const s0=first+r*per,p=at(f,s0,s0+24),ry=y+hdrH+8+r*rowH;
    if(p<=0)return;

      if(o2.hl&&active){c.fillStyle=rgba(o2.col||col,isLight?.16:.24);rr(c,cx2+3,ry+3,cw-6,rowH-10,6);c.fill()}

      cx2+=cw;
    });

function terminal(c,x,y,w,h,f,lines,o={}){
  const{start=20,speed=.55,pause=18,title='Expected Console Output'}=o;
  const p=ease(at(f,0,30));
  c.save();c.globalAlpha=p;
  rr(c,x,y,w,h,14);c.fillStyle=isLight?'#13111f':'#090912';c.fill();
  c.save();rr(c,x,y,w,h,14);c.clip();c.fillStyle='rgba(255,255,255,.05)';c.fillRect(x,y,w,36);c.restore();
  c.strokeStyle=rgba(PC,.6);c.lineWidth=1.6;rr(c,x,y,w,h,14);c.stroke();
  ['#ff5f56','#ffbd2e','#27c93f'].forEach((k,i)=>{c.fillStyle=k;c.beginPath();c.arc(x+22+i*18,y+18,5,0,7);c.fill()});
  c.restore();
  txt(c,title,x+w-18,y+18,{size:11.5,col:CL.dim,align:'right',a:p});
  const lh=Math.min(30,(h-70)/lines.length);
  let t=(f-start)*speed,ly=y+34+lh*.9+10,last=null,cur=null;
  lines.forEach(seg=>{
    const len=seg.reduce((n,s)=>n+s[0].length,0);
    if(t>0){
      let budget=Math.min(len,Math.floor(t)),cx=x+22;
      seg.forEach(([tx,ck])=>{
        const part=tx.slice(0,Math.max(0,budget));budget-=tx.length;
        if(part){c.save();c.font=`500 14.5px ${FONTS.mono}`;c.fillStyle=CL[ck]||'#f0eeff';c.textAlign='left';c.textBaseline='middle';c.fillText(part,cx,ly);cx+=c.measureText(part).width;c.restore()}
      });
      last=[cx,ly];
      if(t<len+pause*speed)cur=[cx,ly];
    }
    t-=len+pause*speed;ly+=lh;
  });
  const cp=cur||last;
  if(cp&&Math.floor(f/24)%2===0){c.fillStyle=PC;c.fillRect(cp[0]+3,cp[1]-8,8,16)}
}

OPS.fill={title:'fillFromUser()',btn:'Enter ↵',clear:1,lbl:st=>`readInt → data[${Math.min(st.n,st.a.length-1)}] =`,
 idle:'Manual mode: type values separated by spaces. Try a non-number such as abc, or more values than free slots.',
 fields:[{k:'vals',l:'readInt → data[0] =',str:1,d:'',ph:'e.g. 12 45 7',cls:'wide'}],
 init:()=>({a:blank(8),n:0,base:4096}),demos:[{vals:'12 45 7 23 9'},{vals:'12 abc 45 7'},{vals:'1 2 3 4 5 6 7 8 9'}],
 run(st,p){const s=cp(st),T=this.title,fr=[];
  const isInt=t=>t!==''&&Number.isInteger(Number(t));
  const toks=String(p.vals||'').split(/[\s,]+/).filter(x=>x!==''),n=toks.filter(isInt).length;
  if(!n)return{st:s,frames:[mk(s.a,s.n,{},'Type at least one whole number, for example: 12',T,{err:1,ln:[7]})]};
  const room=s.a.length-s.n;
  fr.push(mk(s.a,s.n,{},`fillFromUser(${n}): capacity ${s.a.length}, size ${s.n}, free slots ${room}`,T,{ln:[0]}));
  if(n>room){fr.push(mk(s.a,s.n,{},`n = ${n} > capacity - size = ${room} → prints "Invalid n" → return. Nothing changes.`,T,{err:1,ln:[1,2,3]}));return{st:s,frames:fr}}
  let k=0;
  toks.forEach(t=>{if(k>=n)return;
   if(!isInt(t)){fr.push(mk(s.a,s.n,{},`readInt: "${t}" is not an integer → cin.clear(); cin.ignore(); asks for element ${k+1} again`,T,{err:1,ln:[7]}));return}
   const i=s.n;s.a[i]=Number(t);s.n++;k++;
   fr.push(mk(s.a,s.n,{[i]:'w'},`readInt → ${t};  data[${i}] = ${t};  size++ → ${s.n}`,T,{ln:[6,7,8],i}))});
  fr.push(mk(s.a,s.n,{},`Done. size = ${s.n}.`,T,{ln:[9]}));
  return{st:s,frames:fr}}};

 init:()=>({a:[12,45,7,23,9,null,null,null],n:5,base:4096}),demos:[{}],
 run(st){const s=cp(st),T=this.title,fr=[];
  fr.push(mk(s.a,s.n,{},`display(): start traversal, i = 0, size = ${s.n}`,T,{ln:[0]}));
  for(let i=0;i<s.n;i++)fr.push(mk(s.a,s.n,{[i]:'r'},`i = ${i}: cout << "Index ${i} = ${s.a[i]}"  (read only)`,T,{ln:[1,2,3],i}));

OPS.ins={title:'insertAt(pos, value)',idle:'Manual mode: choose a value and a position, then press Run.',fields:[{k:'v',l:'value',d:99},{k:'p',l:'pos',d:2}],
 init:()=>({a:[10,20,30,40,null,null],n:4,base:4096}),demos:[{v:99,p:2}],
 run(st,p){const s=cp(st),T=this.title,fr=[],cap=s.a.length;
  if(p.v===null||p.p===null)return{st:s,frames:[mk(s.a,s.n,{},'Enter both a value and a position.',T,{err:1})]};
  fr.push(mk(s.a,s.n,{},`insertAt(${p.p}, ${p.v}): size ${s.n}, capacity ${cap}`,T,{ln:[0]}));
  if(s.n===cap){fr.push(mk(s.a,s.n,{},'size == capacity → the list is FULL → returns false. Nothing changes.',T,{err:1,ln:[1,2]}));return{st:s,frames:fr}}
  if(p.p<0||p.p>s.n){fr.push(mk(s.a,s.n,{},`pos ${p.p} is outside 0 … ${s.n} → returns false. Nothing changes.`,T,{err:1,ln:[1,2]}));return{st:s,frames:fr}}
  if(p.p===s.n)fr.push(mk(s.a,s.n,{},'pos == size → appending at the end, nothing to shift.',T,{ln:[3]}));

OPS.push={title:'push(value) and grow()',idle:'Manual mode: push a value. When the list is full it doubles its capacity.',fields:[{k:'v',l:'value',d:50}],
 init:()=>({a:[10,20,30,40],n:4,base:4096}),demos:[{v:50}],
 run(st,p){const s=cp(st),T=this.title,fr=[];const X=o=>Object.assign({base:s.base},o);
  if(p.v===null)return{st:s,frames:[mk(s.a,s.n,{},'Enter a value to push.',T,X({err:1}))]};
  fr.push(mk(s.a,s.n,{},`push(${p.v}): size ${s.n}, capacity ${s.a.length}`,T,X({ln:[0]})));
  if(s.n===s.a.length){
   const oc=s.a.length,nc=oc*2,nbase=s.base+4096;
   if(nc>16){fr.push(mk(s.a,s.n,{},'Demo limit: capacity 16 reached. Press Reset to start again.',T,X({err:1})));return{st:s,frames:fr}}
   fr.push(mk(s.a,s.n,{},'size == capacity → FULL → call grow()',T,X({err:1,ln:[1,2]})));
   const nb=blank(nc);
   fr.push(mk(s.a,s.n,{},`newCap = ${oc} × 2 = ${nc};  int* bigger = new int[${nc}];`,T,X({b:[...nb],bn:0,bb:nbase,ln:[6,7,8]})));
   for(let i=0;i<s.n;i++){nb[i]=s.a[i];fr.push(mk(s.a,s.n,{[i]:'r'},`bigger[${i}] = data[${i}];  // copy ${s.a[i]}`,T,X({b:[...nb],bh:{[i]:'w'},bn:i+1,bb:nbase,i,ln:[9,10]})))}
   const all={};s.a.forEach((_,i)=>{all[i]='x'});
   fr.push(mk(s.a,s.n,all,'delete[] data;  // free the old block',T,X({b:[...nb],bn:s.n,bb:nbase,ln:[11]})));
   s.a=nb;s.base=nbase;
   fr.push(mk(s.a,s.n,{},`data = bigger; capacity = ${nc}. The block moved to a new address; the copy cost O(n).`,T,X({ln:[12,13]})));
  }
  s.a[s.n]=p.v;s.n++;
  fr.push(mk(s.a,s.n,{[s.n-1]:'w'},`data[size++] = ${p.v};  → size = ${s.n}. Without a grow, push is O(1).`,T,X({ln:[3]})));
  return{st:s,frames:fr}}};
OPS.grid={title:'2D array in one block',idle:'Manual mode: pick row and col (and optionally a value to write), then press Run.',speed:42,fields:[{k:'r',l:'row',d:1},{k:'c',l:'col',d:2},{k:'v',l:'set'}],

 run(st,p){const s=cp(st),T=this.title,fr=[],R=s.rows,C=s.cols;
  if(p.trav){
   fr.push(gmk(s,null,null,null,'Row-major order: the whole matrix lives in ONE flat block.',T,{ln:[4,5]}));
   for(let r=0;r<R;r++)for(let c=0;c<C;c++)fr.push(gmk(s,r,'r',c,`a[${r}][${c}] → index ${r} × ${C} + ${c} = ${r*C+c}`,T,{ln:[7,8]}));
   return{st:s,frames:fr}}
  if(p.r===null||p.c===null)return{st:s,frames:[gmk(s,null,null,null,'Enter a row and a column.',T,{err:1})]};

  return{st:s,frames:fr}}};

function arrowHead(c,x,y,dir,col,sz){
 c.save();c.fillStyle=col;c.beginPath();
 if(dir==='down'){c.moveTo(x,y);c.lineTo(x-sz,y-sz*1.5);c.lineTo(x+sz,y-sz*1.5)}
 else if(dir==='left'){c.moveTo(x,y);c.lineTo(x+sz*1.5,y-sz);c.lineTo(x+sz*1.5,y+sz)}
 else{c.moveTo(x,y);c.lineTo(x-sz*1.5,y-sz);c.lineTo(x-sz*1.5,y+sz)}
 c.closePath();c.fill();c.restore();
}
function mmChain(c,b,active){
 const items=['Memory','Address','Pointer','Heap','Dynamic array','Index','ArrayList'];
 c.save();c.font=`700 10.5px ${FONTS.ui}`;
 const sep=18,ws=items.map(s=>c.measureText(s).width),tot=ws.reduce((a,v)=>a+v,0)+sep*(items.length-1);
 let x=b.x+b.w/2-tot/2;const y=b.y+b.h-18;c.textBaseline='middle';c.textAlign='left';
 items.forEach((s,i)=>{
  c.fillStyle=i===active?CL.pink:i<active?CL.chalk:CL.dim;c.globalAlpha=i===active?1:i<active?.85:.55;
  c.fillText(s,x,y);x+=ws[i];

 });
 c.restore();
}

c_ins:`bool ArrayList::insertAt(int pos, int value) {
    if (size == capacity || pos < 0 || pos > size)
        return false;
    for (int i = size; i > pos; i--)
        data[i] = data[i - 1];   // shift right
    data[pos] = value;
    size++;
    return true;
}`,
c_del:`bool ArrayList::deleteAt(int pos) {
    if (pos < 0 || pos >= size)
        return false;
    for (int i = pos; i < size - 1; i++)

    size--;
    return true;
}`,

c_push:`void ArrayList::push(int value) {
    if (size == capacity)
        grow();                  // full: double it
    data[size++] = value;

void ArrayList::grow() {
    int newCap = capacity * 2;
    int* bigger = new int[newCap];
    for (int i = 0; i < size; i++)
        bigger[i] = data[i];     // copy
    delete[] data;               // free old block
    data = bigger;
    capacity = newCap;
}`,

// Fix: a DEEP copy constructor
ArrayList::ArrayList(const ArrayList& other) {
    capacity = other.capacity;
    size = other.size;
    data = new int[capacity];      // own block
    for (int i = 0; i < size; i++)
        data[i] = other.data[i];   // copy values
}

function highlight(src){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const re=/(\/\/[^\n]*)|(#include\s*<[^>\n]+>)|("(?:[^"\\\n]|\\.)*")|('(?:[^'\\\n]|\\.)')|\b(\d+(?:\.\d+)?)\b|\b(long long|int|double|char|bool|void|float|ArrayList|Matrix)\b|\b(return|if|else|for|while|do|using|namespace|true|false|class|public|private|const|new|delete)\b|\b(cout|cin|endl)\b|\b([A-Za-z_]\w*)(?=\()/g;
  let out='',last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));const t=m[0];
    const cls=m[1]?'c':m[2]?'p':(m[3]||m[4])?'s':m[5]?'n':m[6]?'t':m[7]?'k':m[8]?'o':'f';
    out+=`<span class="${cls}">${esc(t)}</span>`;last=m.index+t.length;
  }
  return out+esc(src.slice(last));
}

/* Copy-to-Clipboard Event Listener */
document.addEventListener("click", async e=>{
  const btn = e.target.closest(".copy-btn");
  if(!btn) return;
  const targetId = btn.getAttribute("data-target");
  const el = document.getElementById(targetId);
  if(!el) return;
  const text = el.innerText;
  try{
    await navigator.clipboard.writeText(text);
  }catch(_){
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
  }
  const original = btn.innerHTML;
  btn.classList.add("copied");
  btn.innerHTML = "✅ Copied";
  setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML = original; }, 1600);
});

/* Keyboard Listener Supporting Both English and Arabic Layouts */
document.addEventListener('keydown', e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ if(e.key==='Escape') e.target.blur(); return; }
  const k = e.key;
  const code = e.code;

  if(['ArrowRight','ArrowDown','PageDown',' '].includes(k) || code === 'Space' || code === 'Enter'){
    e.preventDefault(); go(cur+1);
  }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){
    e.preventDefault(); go(cur-1);
  }
  else if(code === 'Home') go(0);
  else if(code === 'End') go(N-1);
  // S / s / س
  else if(code === 'KeyS' || k === 's' || k === 'S' || k === 'س'){
    toggleSol();
  }
  // F / f / ب
  else if(code === 'KeyF' || k === 'f' || k === 'F' || k === 'ب'){
    try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch(_){}
  }
  // L / l / م for Laser pointer
  else if(code === 'KeyL' || k === 'l' || k === 'L' || k === 'م'){
    toggleLaser();
  }
  else if(code === 'KeyD' || k === 'd' || k === 'D' || k === 'ي' || code === 'KeyP' || k === 'p' || k === 'P' || k === 'ح'){
    togglePen();
  }
  else if(typeof penActive!=='undefined' && penActive && (code === 'KeyC' || k === 'c' || k === 'C' || k === 'ؤ')){
    clearPen();
  }
  else if(typeof penActive!=='undefined' && penActive && (code === 'KeyU' || k === 'u' || k === 'U' || k === 'ع' || (e.ctrlKey && k === 'z'))){
    undoPen();
  }
  else if(code === 'Escape'){
    if(laserActive) toggleLaser(); if(typeof penActive!=='undefined' && penActive) togglePen(false);
    closeSol();
  }
});

/* Laser Pointer Mode */
let laserActive = false, laserDot = null;
let lastLaserX = -100, lastLaserY = -100;

function updateLaserPos(clientX, clientY){
  if(clientX !== undefined && clientY !== undefined){
    lastLaserX = clientX;
    lastLaserY = clientY;
  }
  if(laserActive && laserDot){
    laserDot.style.left = lastLaserX + 'px';
    laserDot.style.top = lastLaserY + 'px';
  }
}

function toggleLaser(){
  laserActive = !laserActive;
  if(!laserDot){
    laserDot = document.createElement('div');
    laserDot.className = 'laser-pointer';
    document.body.appendChild(laserDot);
  }
  laserDot.classList.toggle('active', laserActive);
  document.body.classList.toggle('laser-active', laserActive);
  if(laserActive && lastLaserX > 0 && lastLaserY > 0){
    laserDot.style.left = lastLaserX + 'px';
    laserDot.style.top = lastLaserY + 'px';
  }
}

window.addEventListener('pointermove', e => {

const fitbox=document.getElementById('fitbox'),deck=document.getElementById('deck');
function layout(){
  const W=window.innerWidth,H=window.innerHeight;
  const small = Math.min(W, H) < 768 || W < 992;
  document.body.classList.toggle('small', small);
  if(!small){
    const s = Math.min((W - 20) / 1100, (H - 24) / 707);
    vp.style.width = '1100px'; vp.style.height = '619px';
    deck.style.width = '1100px'; deck.style.height = '707px';
    fitbox.style.width = Math.round(1100 * s) + 'px';
    fitbox.style.height = Math.round(707 * s) + 'px';
    deck.style.transformOrigin = 'top left'; deck.style.transform = `scale(${s})`;
    SC = Math.max(.2, s); return;
  }
  const isLandscape = W >= H;
  let s, dw, dh;
  if(isLandscape){
    s = H / 619;
    if(W / s < 1100){ s = W / 1100; dw = 1100; dh = Math.round(H / s); }
    else { dw = Math.round(W / s); dh = 619; }
  } else {
    s = W / 1100; dw = 1100; dh = 619;
  }
  vp.style.width = dw + 'px'; vp.style.height = dh + 'px';
  deck.style.width = dw + 'px'; deck.style.height = dh + 'px';
  fitbox.style.width = (isLandscape ? W : Math.round(dw * s)) + 'px';
  fitbox.style.height = (isLandscape ? H : Math.round(dh * s)) + 'px';
  deck.style.transformOrigin = 'top left';
  deck.style.transform = `scale(${s})`;
  SC = Math.max(.2, s);
}

const amb=fit(document.getElementById('amb'));
const blobs=[[.2,.3,'#6366f1'],[.75,.25,'#a855f7'],[.55,.75,'#ec4899'],[.15,.8,'#6366f1']];
const specks=Array.from({length:46},(_,i)=>[(i*.6180339)%1,(i*.3819661+.17)%1,i*1.7]);
function aurora(f){
  amb.rs();const{ctx,W,H}=amb;if(!W)return;
  ctx.fillStyle=isLight?'#ebe9f5':'#07070d';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
  blobs.forEach(([bx,by,col],i)=>{
    const x=W*bx+Math.sin(f*.004+i)*70,y=H*by+Math.cos(f*.003+i*1.7)*50,r=Math.min(W,H)*(.42+.05*Math.sin(f*.006+i));
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,col+(isLight?'15':'22'));
    g.addColorStop(1,col+'00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  });
  ctx.globalCompositeOperation='source-over';
  specks.forEach(([dx,dy,ph])=>{
    ctx.fillStyle=isLight?`rgba(90,80,140,${.12+.1*Math.sin(f*.02+ph)})`:`rgba(200,190,255,${.18+.18*Math.sin(f*.02+ph)})`;
    ctx.beginPath();ctx.arc(dx*W,dy*H,1.1,0,7);ctx.fill()
  });
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
  v.addColorStop(0,'rgba(5,5,9,0)');
  v.addColorStop(1,isLight?'rgba(235,233,245,.65)':'rgba(5,5,9,.7)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function tick(){
  frame++;aurora(frame);
  for(const o of live){
    if(o.slide!==cur)continue;
    o.s.rs();const{ctx,W,H}=o.s;if(!W)continue;
    ctx.clearRect(0,0,W,H);CW=W;
    o.def.draw(ctx,W,H,(frame-t0)%o.def.cycle,frame,o);
  }
  requestAnimationFrame(tick);
}
go(0);tick();

/* ═══════════════ Live Drawing Pen (Annotation Engine) ═══════════════ */
let penCanvas = null;
let penCtx = null;
let penToolbar = null;
let penToggleBtn = null;
let mPenToggleBtn = null;
let penActive = false;
let penTool = 'pen'; // 'pen', 'highlighter', 'eraser'
let penColor = '#c084fc';
let strokes = [];
let currentStroke = null;

function resizePenCanvas(){
  if(!penCanvas) return;
  if(!penCtx) penCtx = penCanvas.getContext('2d');
  if(!penCtx) return;
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  const oldW = penCanvas.dataset.cssW ? parseFloat(penCanvas.dataset.cssW) : w;
  const oldH = penCanvas.dataset.cssH ? parseFloat(penCanvas.dataset.cssH) : h;
  if(oldW > 0 && oldH > 0 && (oldW !== w || oldH !== h) && strokes.length > 0){
    const rx = w / oldW;
    const ry = h / oldH;
    for(const s of strokes){
      if(s.points){
        for(const p of s.points){
          p.x *= rx;
          p.y *= ry;
        }
      }
    }
  }
  penCanvas.dataset.cssW = w;
  penCanvas.dataset.cssH = h;
  penCanvas.width = Math.round(w * dpr);
  penCanvas.height = Math.round(h * dpr);
  penCanvas.style.width = w + 'px';
  penCanvas.style.height = h + 'px';
  penCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redrawPen();
}

function togglePen(force){
  penActive = typeof force === 'boolean' ? force : !penActive;
  document.body.classList.toggle('pen-active', penActive);
  if(penToolbar) penToolbar.hidden = !penActive;
  if(penToggleBtn) penToggleBtn.classList.toggle('active', penActive);
  if(mPenToggleBtn) mPenToggleBtn.classList.toggle('active', penActive);
  if(penActive) resizePenCanvas();
}

function clearPen(){
  strokes = [];
  if(penCtx && penCanvas){
    penCtx.save();
    penCtx.setTransform(1, 0, 0, 1, 0, 0);
    penCtx.clearRect(0, 0, penCanvas.width, penCanvas.height);
    penCtx.restore();
  }
}

function undoPen(){
  if(strokes.length > 0){
    strokes.pop();
    redrawPen();
  }
}

function redrawPen(){
  if(!penCtx || !penCanvas) return;
  penCtx.save();
  penCtx.setTransform(1, 0, 0, 1, 0, 0);
  penCtx.clearRect(0, 0, penCanvas.width, penCanvas.height);
  penCtx.restore();
  for(const s of strokes){
    drawPenStroke(s);
  }
}

function drawPenStroke(s){
  if(!s.points || s.points.length === 0) return;
  penCtx.save();

  if(s.points.length === 1){
    const p = s.points[0];
    if(s.tool === 'eraser'){
      penCtx.globalCompositeOperation = 'destination-out';
      penCtx.beginPath();
      penCtx.arc(p.x, p.y, 14, 0, Math.PI * 2);
      penCtx.fill();
    } else if(s.tool === 'highlighter'){
      penCtx.globalCompositeOperation = 'source-over';
      penCtx.fillStyle = s.color;
      penCtx.globalAlpha = 0.35;
      penCtx.beginPath();
      penCtx.arc(p.x, p.y, 9, 0, Math.PI * 2);
      penCtx.fill();
    } else {
      penCtx.globalCompositeOperation = 'source-over';
      penCtx.fillStyle = s.color;
      penCtx.shadowColor = s.color;
      penCtx.shadowBlur = 8;
      penCtx.beginPath();
      penCtx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
      penCtx.fill();
    }
    penCtx.restore();
    return;
  }

  if(s.tool === 'eraser'){
    penCtx.globalCompositeOperation = 'destination-out';
    penCtx.lineWidth = 28;
    penCtx.lineCap = 'round';
    penCtx.lineJoin = 'round';
  } else if(s.tool === 'highlighter'){
    penCtx.globalCompositeOperation = 'source-over';
    penCtx.strokeStyle = s.color;
    penCtx.globalAlpha = 0.35;
    penCtx.lineWidth = 18;
    penCtx.lineCap = 'round';
    penCtx.lineJoin = 'round';
  } else {
    penCtx.globalCompositeOperation = 'source-over';
    penCtx.strokeStyle = s.color;
    penCtx.lineWidth = 3.5;
    penCtx.lineCap = 'round';
    penCtx.lineJoin = 'round';
    penCtx.shadowColor = s.color;
    penCtx.shadowBlur = 8;
  }

  penCtx.beginPath();
  penCtx.moveTo(s.points[0].x, s.points[0].y);
  for(let i = 1; i < s.points.length; i++){
    const p1 = s.points[i - 1];
    const p2 = s.points[i];
    penCtx.quadraticCurveTo(p1.x, p1.y, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
  }
  const last = s.points[s.points.length - 1];
  penCtx.lineTo(last.x, last.y);
  penCtx.stroke();
  penCtx.restore();
}

function getPenPos(e){
  let cx = e.clientX, cy = e.clientY;
  if((cx === undefined || cx === null) && e.touches && e.touches.length > 0){
    cx = e.touches[0].clientX;
    cy = e.touches[0].clientY;
  }
  return { x: cx, y: cy };
}

function initPen(){
  penCanvas = document.getElementById('penCanvas');
  penCtx = penCanvas ? penCanvas.getContext('2d') : null;
  penToolbar = document.getElementById('penToolbar');
  penToggleBtn = document.getElementById('penToggle');
  mPenToggleBtn = document.getElementById('mPenToggle');
  resizePenCanvas();

  if(penCanvas){
    penCanvas.addEventListener('pointerdown', e => {
      if(typeof updateLaserPos === 'function') updateLaserPos(e.clientX, e.clientY);
      if(!penActive) return;
      e.preventDefault();
      try{ penCanvas.setPointerCapture(e.pointerId); }catch(_){}
      const p = getPenPos(e);
      currentStroke = { tool: penTool, color: penColor, points: [p] };
      strokes.push(currentStroke);
      redrawPen();
    });

    penCanvas.addEventListener('pointermove', e => {
      if(typeof updateLaserPos === 'function') updateLaserPos(e.clientX, e.clientY);
      if(!penActive || !currentStroke) return;
      e.preventDefault();
      const p = getPenPos(e);
      currentStroke.points.push(p);
      redrawPen();
    });

    const endStroke = e => {
      if(e && typeof updateLaserPos === 'function') updateLaserPos(e.clientX, e.clientY);
      if(currentStroke){
        currentStroke = null;
        redrawPen();
      }
    };
    penCanvas.addEventListener('pointerup', endStroke);
    penCanvas.addEventListener('pointercancel', endStroke);
    window.addEventListener('pointerup', endStroke);
  }

  if(penToolbar){
    penToolbar.querySelectorAll('[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => {
        penToolbar.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        penTool = btn.dataset.tool;
      });
    });

    penToolbar.querySelectorAll('[data-color]').forEach(dot => {
      dot.addEventListener('click', () => {
        penToolbar.querySelectorAll('[data-color]').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        penColor = dot.dataset.color;
        if(penTool === 'eraser'){
          const penBtn = penToolbar.querySelector('[data-tool="pen"]');
          if(penBtn) penBtn.click();
        }
      });
    });

    const uBtn = document.getElementById('penUndo');
    if(uBtn) uBtn.addEventListener('click', undoPen);
    const cBtn = document.getElementById('penClear');
    if(cBtn) cBtn.addEventListener('click', clearPen);
    const xBtn = document.getElementById('penClose');
    if(xBtn) xBtn.addEventListener('click', () => togglePen(false));
  }

  if(penToggleBtn) penToggleBtn.addEventListener('click', () => togglePen());
  if(mPenToggleBtn) mPenToggleBtn.addEventListener('click', () => togglePen());
}

window.addEventListener('resize', resizePenCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizePenCanvas, 100));

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initPen);
} else {
  initPen();
}

</script>
</body>

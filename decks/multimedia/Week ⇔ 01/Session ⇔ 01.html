<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multimedia — Session ⇔ 01 · Introduction to Python</title>
<meta name="description" content="Multimedia Course — Session 01: Introduction to Python by Eng. Muhammad Ali Abdul Kareem, Sinai University.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  color-scheme:dark;
  /* chapter colour — changes with every chapter */
  --c:#ec4899; --c-2:#a855f7;
  --c-grad:linear-gradient(90deg,var(--c),var(--c-2));
  /* identity constants */
  --bg:#07070d; --card:rgba(18,18,28,.82); --border:rgba(255,255,255,.07);
  --tp:#f0eeff; --ts:#9a9ab5; --tm:#6b6b85; --warn:#fb7185;
  --syntax-grad:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--tp);font-family:Inter,system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:flex;align-items:center;justify-content:center}
body.small{padding:0!important}
#fitbox{position:relative;flex:none}
#deck{width:1100px;height:707px;position:absolute;left:0;top:0;transform-origin:top left}

/* brand bar */
.brand-bar{height:44px;display:flex;justify-content:space-between;align-items:center}
.brand-left{display:flex;align-items:center;gap:11px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--syntax-grad);display:grid;place-items:center;font:800 13px var(--mono);color:#fff;letter-spacing:-1px}
.brand-name{font-size:15px;font-weight:900;background:var(--syntax-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.brand-sub{font-size:11px;color:var(--tm);font-weight:600}
.brand-right{font-size:11.5px;color:var(--ts);font-weight:700}

/* 16:9 stage */
.vp{width:1100px;height:619px;position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:var(--bg);box-shadow:0 0 0 1px rgba(168,85,247,.08),0 32px 70px rgba(0,0,0,.8)}
.vp.part-intro{--c:#ec4899;--c-2:#a855f7}
.vp.part-seq{--c:#6366f1;--c-2:#8b5cf6}
.vp.part-sel{--c:#f59e0b;--c-2:#fbbf24}
.vp.part-rep{--c:#22d3ee;--c-2:#06b6d4}
.vp.part-fn{--c:#10b981;--c-2:#34d399}
.vp.part-col{--c:#a855f7;--c-2:#c084fc}
.vp-bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.vp-progress{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.05);z-index:6}
.vp-progress span{display:block;height:100%;width:0;background:var(--syntax-grad);box-shadow:0 0 12px #a855f7;border-radius:0 3px 3px 0;transition:width .45s ease}
.slide-counter{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;padding:5px 14px;border-radius:999px;background:rgba(12,12,20,.75);border:1px solid var(--border);font-size:12px;font-weight:800;color:var(--ts)}

/* slide */
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:46px 52px 40px;z-index:2}
.slide.active{display:flex}
.slide>*{animation:revealUp .6s ease both}
.slide>*:nth-child(2){animation-delay:.08s}
.slide>*:nth-child(3){animation-delay:.16s}
.slide>*:nth-child(4){animation-delay:.24s}
.slide>*:nth-child(5){animation-delay:.32s}
@keyframes revealUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.lbl{font-size:12.5px;font-weight:800;color:var(--c);margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase}
h2{margin:0 0 6px;font-size:27px;font-weight:900;line-height:1.3;letter-spacing:-.3px}
h2 em{font-style:normal;background:var(--c-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;font-size:14.5px;color:var(--ts);line-height:1.6;max-width:820px}
.sub strong{color:var(--tp)}
code,pre.code{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
code{font-family:var(--mono);font-size:.92em;color:#c7b3ff;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px}
.stage{flex:1;position:relative;min-height:0;margin-top:10px}
.viz{position:absolute;inset:0}
.viz canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* footer */
.sf{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--tm);font-weight:600;margin-top:10px;height:16px}
.pd{display:flex;gap:4px;align-items:center}
.dot{width:5px;height:5px;border-radius:99px;background:rgba(255,255,255,.14);transition:.3s}
.dot.on{width:18px;background:var(--c-grad)}

/* hero */
.hero-slide{justify-content:center}
.hero-slide .lbl{margin-top:auto}
.hero-slide h1{margin:6px 0 10px;font-size:72px;line-height:1.02;font-weight:900;letter-spacing:-2px}
.hero-slide h1 em{font-style:normal;background:var(--syntax-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-slide .tag{font-size:21px;color:var(--ts);font-weight:600;max-width:760px;line-height:1.45}
.inst{display:flex;align-items:center;gap:14px;margin-top:30px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--syntax-grad);display:grid;place-items:center;font-weight:900;font-size:23px;box-shadow:0 0 24px rgba(168,85,247,.45)}
.inst small{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--tm);font-weight:800;margin-bottom:2px}
.inst b{font-size:21px;font-weight:800}
.chips{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.chips span{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04);font-size:13px;font-weight:700;color:var(--ts)}
.hero-slide .sf{margin-top:auto}
.herobg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* task slides */
.task{display:grid;grid-template-columns:.92fr 1.08fr;gap:24px;position:absolute;inset:0}
.tleft{display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
.chip{align-self:flex-start;padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--c);font-weight:800;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase}
.req{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.req li{position:relative;padding-left:26px;font-size:15px;line-height:1.5;color:var(--tp)}
.req li::before{content:'';position:absolute;left:0;top:.42em;width:11px;height:11px;border-radius:3px;background:var(--c-grad)}
.trap{padding:12px 14px;border-radius:12px;border:1px solid rgba(251,113,133,.4);background:rgba(251,113,133,.08);font-size:13.5px;line-height:1.55;color:var(--tp)}
.trap b{color:var(--warn)}
.tright{position:relative;min-height:0}
.solbtn{position:absolute;top:30px;right:52px;z-index:7;cursor:pointer;padding:8px 16px;border-radius:999px;border:1px solid var(--c);background:rgba(12,12,20,.85);color:var(--tp);font:800 12.5px Inter,system-ui,sans-serif;letter-spacing:.3px}
.solbtn:hover{background:var(--c);color:#07070d}
.solbtn kbd{margin-left:6px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.1);font:700 11px var(--mono)}
.sol{display:none;position:absolute;inset:0;background:rgba(7,7,13,.97);padding:34px 52px 40px;z-index:8;flex-direction:column;gap:14px}
.sol.open{display:flex}
.slide>.sol{animation-delay:0s}
.sol-h{display:flex;justify-content:space-between;align-items:center}
.sol-h .lbl{margin:0;font-size:13px}
.sol-body{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;flex:1;min-height:0}
.codecard{background:rgba(12,12,20,.92);border:1px solid var(--border);border-radius:14px;padding:14px 18px;overflow:hidden;min-height:0}
.notes{display:flex;flex-direction:column;gap:12px;justify-content:center}
.note-h{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--tm)}
.note{padding:12px 15px;border-radius:12px;border:1px solid var(--border);border-left:3px solid var(--c);background:rgba(255,255,255,.03);font-size:14px;line-height:1.55}

/* code */
pre.code{margin:0;font:500 13px/1.5 var(--mono);color:#e8e6ff;white-space:pre;tab-size:4}
pre.code .k{color:var(--c);font-weight:700}
pre.code .t{color:#67e8f9}
pre.code .s{color:#34d399}
pre.code .n{color:#fbbf24}
pre.code .c{color:#6b6b85;font-style:italic}
pre.code .p{color:#a855f7}
pre.code .f{color:#a5b4fc}
pre.code .o{color:#f9a8d4}

/* challenge slide */
.chal{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;position:absolute;inset:0}
.chal .col{display:flex;flex-direction:column;gap:14px;min-height:0}
.chal .codecard{flex:none}
.chal pre.code{font-size:14px}
.q{padding:16px 18px;border-radius:14px;border:1px solid var(--c);background:rgba(255,255,255,.03);flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.q b{font-size:18px}
.q .term{font:600 16px var(--mono);color:var(--ts)}
.q .term i{display:inline-block;width:9px;height:18px;background:var(--c);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* controls */
.controls{height:44px;display:flex;align-items:center;justify-content:space-between;color:var(--tm);font-size:12px;font-weight:600}
.controls button{cursor:pointer;padding:7px 16px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--ts);font:700 12px Inter,system-ui,sans-serif}
.controls button:hover{color:var(--tp);border-color:rgba(255,255,255,.25)}
.controls kbd{padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.08);font:700 11px var(--mono);color:var(--ts)}

/* code walkthrough slides */
.walk{display:grid;grid-template-columns:1.12fr 1fr;gap:22px;position:absolute;inset:0}
.walk .codecard{padding:16px 20px;align-self:stretch;display:flex;align-items:center}
.walk pre.code{font-size:14.5px;line-height:1.75;width:100%}
pre.code .ln{display:block;padding:0 12px;margin:0 -12px;border-radius:6px;opacity:.5;transition:opacity .25s,background .25s}
pre.code .ln.on{opacity:1;background:rgba(255,255,255,.08);box-shadow:inset 3px 0 0 var(--c)}
.steps{display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0}
.stp{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.02);cursor:pointer;opacity:.5;transition:opacity .25s,border-color .25s,background .25s}
.stp.on{opacity:1;border-color:var(--c);background:rgba(255,255,255,.06)}
.stp i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--c-grad);color:#07070d;font:900 12px Inter,system-ui,sans-serif;font-style:normal;display:grid;place-items:center;margin-top:1px}
.stp b{display:block;font-size:14.5px;margin-bottom:3px}
.stp code{white-space:pre}
.stp span b{display:inline;font-size:inherit;margin:0;color:var(--tp)}
.stp span{font-size:13px;color:var(--ts);line-height:1.5;display:block}
/* side-by-side code cards */
.cards{display:grid;gap:18px;position:absolute;inset:0;align-content:center}
.cc{display:flex;flex-direction:column;gap:10px;min-width:0}
.cc-h{font-size:12.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--c)}
.cc .codecard{flex:none;padding:16px 16px;min-height:230px}
.cc pre.code{font-size:var(--fs,13px);line-height:1.7}
.cc-n{font-size:13px;line-height:1.55;color:var(--ts);min-height:60px}
.cc-n b{color:var(--tp)}
/* no font ligatures in code: students must see the real characters  <=  <<  >> */
pre.code,pre.code *,code,.wr .op,.wr .we,.wr .pp,.wr .wres,.stv,.stn{font-variant-ligatures:none!important;font-feature-settings:"liga" 0,"calt" 0!important}

/* phones: hide chrome, fill the whole screen (landscape) or rotate to fill it (portrait) */
.mnav{display:none;position:absolute;top:50%;z-index:9;width:38px;height:38px;margin-top:-19px;border-radius:50%;border:1px solid var(--border);background:rgba(12,12,20,.55);color:var(--tp);font:800 20px/1 Inter,system-ui,sans-serif;cursor:pointer;place-items:center;padding:0;opacity:.6}
.mnav.mp{left:6px}.mnav.mn{right:6px}
.small .mnav{display:grid}
.small .brand-bar,.small .controls{display:none}
.small .vp{border-radius:12px}

/* answer box for the tracing challenge (lives outside the rotated deck, so the phone keyboard works) */
.ansbtn{align-self:flex-start;cursor:pointer;padding:9px 18px;border-radius:999px;border:1px solid var(--c);background:rgba(255,255,255,.05);color:var(--tp);font:800 13.5px Inter,system-ui,sans-serif}
.ansbtn:hover{background:var(--c);color:#07070d}
.ansbtn kbd{margin-left:8px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.12);font:700 11px var(--mono)}
.q .term{cursor:pointer;min-height:24px}
.q .term .typed{color:var(--tp)}
.ansmodal{position:fixed;inset:0;z-index:100;display:flex;justify-content:center;align-items:flex-start;padding:8vh 12px 12px;background:rgba(5,5,10,.78)}
.ansmodal[hidden]{display:none}
.ans-card{width:min(94vw,460px);background:#0b0b14;border:1px solid rgba(168,85,247,.65);border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.7);font-family:Inter,system-ui,sans-serif;color:#f0eeff}
.ans-h{font-weight:800;font-size:16px;margin-bottom:12px}
.ans-row{display:flex;align-items:center;gap:8px;background:#05050a;border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.ans-row span{font:700 16px "JetBrains Mono",ui-monospace,monospace;color:#9a9ab5}
.ans-row input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#34d399;font:600 16px "JetBrains Mono",ui-monospace,monospace}
.ans-fb{font-size:13.5px;line-height:1.55;margin-top:12px;min-height:0}
.ans-fb.ok{color:#34d399}.ans-fb.bad{color:#fb7185}
.ans-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ans-btns button{cursor:pointer;padding:9px 16px;border-radius:999px;border:1px solid rgba(168,85,247,.6);background:linear-gradient(90deg,#6366f1,#a855f7);color:#fff;font:800 13px Inter,system-ui,sans-serif}
.ans-btns button.ghost{background:transparent;color:#9a9ab5;border-color:rgba(255,255,255,.15)}
@media (max-height:500px){.ansmodal{padding-top:6px}.ans-card{padding:12px}.ans-h{font-size:14px;margin-bottom:8px}.ans-fb{margin-top:8px}.ans-btns{margin-top:10px}}

/* interactive widgets (operators) */
.wg{display:grid;grid-template-columns:.36fr 1fr;gap:22px;position:absolute;inset:0;align-items:center}
.wg-in{padding:20px;border-radius:16px;border:1px solid var(--c);background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:16px}
.wg-h{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--c)}
.st{display:flex;align-items:center;gap:10px}
.stn{font:800 24px var(--mono);width:26px;color:var(--tp)}
.st button{cursor:pointer;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--tp);font:800 22px/1 Inter,system-ui,sans-serif;padding:0}
.st button:hover{background:var(--c);color:#07070d}
.stv{font:800 28px var(--mono);min-width:60px;text-align:center}
.wg-note{font-size:12.5px;color:var(--ts);line-height:1.55}
.wg-out{display:flex;flex-direction:column;gap:7px;min-width:0}
.wr{display:grid;grid-template-columns:52px 1.2fr 1fr 1.15fr;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.03);font-size:13px;min-width:0}
.wr.l3{grid-template-columns:52px 1.25fr 1.5fr 1fr}
.wr .op{font:800 15px var(--mono);color:var(--c)}
.wr .wn{color:var(--ts);font-size:12.5px;line-height:1.35}
.wr .we{font:600 13px var(--mono);color:var(--tp);white-space:nowrap}
.wr .wres{font:800 14.5px var(--mono);text-align:right;white-space:nowrap}
.wr .pp{font:600 12px var(--mono);color:var(--ts);margin-right:8px}
.wr .ok{color:#34d399}.wr .bad{color:#fb7185}.wr .err{color:#fbbf24}
.wr.flash{animation:wflash .55s}
@keyframes wflash{from{background:rgba(255,255,255,.16)}to{background:rgba(255,255,255,.03)}}
.walk.dense .stp{padding:7px 12px}
.walk.dense .steps{gap:7px}
.walk.dense .stp b{font-size:13.5px;margin-bottom:1px}
.walk.dense .stp span{font-size:12.5px}

#boot{position:fixed;inset:0;display:grid;place-items:center;background:#07070d;color:#9a9ab5;font:700 14px system-ui,sans-serif;z-index:200}

/* ── code windows: editor look, line numbers, hug the content ── */
.codecard{background:#0b0b14;border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:0;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.ed-bar{display:flex;align-items:center;gap:6px;padding:9px 14px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--c)}
.ed-bar i{width:9px;height:9px;border-radius:50%;display:block;flex:none}
.cc .ed-lang{display:none}
.cc .ed-body{min-height:118px}
.ed-file{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-file{margin-left:10px;font:600 11.5px var(--mono);color:var(--ts)}
.ed-lang{margin-left:auto;font:800 10px Inter,system-ui,sans-serif;letter-spacing:.9px;text-transform:uppercase;color:var(--c)}
.ed-body{padding:14px 16px}
.walk .codecard{padding:0;align-self:center;display:block}
.cc .codecard{min-height:0;padding:0}
.chal>.codecard{align-self:center}
.sol-body{align-items:center}
.sol-body .notes{align-self:center}
pre.code{counter-reset:ln}
pre.code .ln{counter-increment:ln;display:block;padding:0 10px;margin:0 -10px;border-radius:6px;opacity:1}
pre.code .ln::before{content:counter(ln);display:inline-block;width:2ch;margin-right:16px;text-align:right;color:#4b4b66}
.walk pre.code .ln{opacity:.5}
.walk pre.code .ln.on{opacity:1;background:rgba(255,255,255,.08);box-shadow:inset 3px 0 0 var(--c)}
.walk{grid-template-rows:minmax(0,1fr)}
.walk .codecard{max-height:100%;overflow:hidden}
</style>
</head>
<body>
<div id="boot">Loading…</div>
<div id="fitbox"><div id="deck">
  <div class="brand-bar">
    <div class="brand-left">
      <a href="../../../index.html" style="padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.07);color:#e9edff;font:600 12px/1 system-ui,sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2);display:inline-flex;align-items:center;gap:6px;transition:background .2s,border-color .2s;flex-shrink:0" onmouseover="this.style.background='rgba(255,255,255,.14)';this.style.borderColor='rgba(255,255,255,.35)'" onmouseout="this.style.background='rgba(255,255,255,.07)';this.style.borderColor='rgba(255,255,255,.2)'">← Back to sessions</a>
      <div class="logo">{ }</div>
      <div>
        <div class="brand-name">Multimedia</div>
        <div class="brand-sub">Session ⇔ 01 · Introduction to Python · Sinai University</div>
      </div>
    </div>
    <div class="brand-right">Instructor · Muhammad Ali Abdul Kareem</div>
  </div>
  <div class="vp part-intro" id="vp">
    <canvas class="vp-bg" id="amb"></canvas>
    <div class="vp-progress"><span id="prog"></span></div>
    <div class="slide-counter" id="counter">1 / 1</div>
    <button class="mnav mp" id="mprev" aria-label="Previous slide">‹</button>
    <button class="mnav mn" id="mnext" aria-label="Next slide">›</button>
  </div>
  <div class="controls">
    <button id="prev" tabindex="-1">‹ Prev</button>
    <span><kbd>→</kbd> next &nbsp;·&nbsp; <kbd>←</kbd> back &nbsp;·&nbsp; <kbd>S</kbd> task solution &nbsp;·&nbsp; <kbd>F</kbd> fullscreen</span>
    <button id="next" tabindex="-1">Next ›</button>
  </div>
</div></div>
<div class="ansmodal" id="ansmodal" hidden>
  <div class="ans-card">
    <div class="ans-h">What is the final console output?</div>
    <div class="ans-row"><span>&gt;</span><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="type your answer"></div>
    <div class="ans-fb" id="ansfb"></div>

  </div>

<script>
/* boot: never let a slow font request or an error leave a blank page */
'use strict';
window.addEventListener('error',function(e){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:999;background:#3b0a14;color:#fecdd3;font:12px/1.4 monospace;padding:10px;border-radius:8px;white-space:pre-wrap';
  d.textContent='Error: '+(e.message||'unknown')+(e.lineno?'  (line '+e.lineno+')':'');
  (document.body||document.documentElement).appendChild(d);
});
(function(){
  var url='https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Lemonada:wght@400;600;700&display=swap';
  function add(){var l=document.createElement('link');l.rel='stylesheet';l.href=url;document.head.appendChild(l)}
  if(document.readyState==='complete')add();else window.addEventListener('load',add);
})();
'use strict';
/* ═══════════════ Core helpers (canvas whiteboard toolkit) ═══════════════ */
const CL={indigo:'#6366f1',violet:'#a855f7',pink:'#ec4899',cyan:'#67e8f9',green:'#34d399',amber:'#fbbf24',chalk:'#eef0ff',dim:'#8a8aa3',board:'#0a0a13'};
const FONTS={ui:'Inter, system-ui, sans-serif',marker:'Lemonada, Inter, sans-serif',mono:'"JetBrains Mono", ui-monospace, Menlo, monospace'};
let PC='#ec4899',PC2='#a855f7',SC=1;               // chapter colours + deck scale
const at=(f,a,b)=>Math.min(1,Math.max(0,(f-a)/(b-a)));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};
const typed=(s,p)=>s.slice(0,Math.ceil(s.length*p));

/** DPR-aware canvas sizing bound to its parent */
function fit(cv){
  const ctx=cv.getContext('2d'),s={ctx,W:0,H:0,d:0},p=cv.parentElement;
  s.rs=()=>{
    const w=p.clientWidth,h=p.clientHeight,d=Math.min((devicePixelRatio||1)*SC,3);
    if(!w||!h||(w===s.W&&h===s.H&&Math.abs(d-s.d)<.01))return;
    s.W=w;s.H=h;s.d=d;cv.width=Math.round(w*d);cv.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);
  };
  s.rs();return s;
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/** ✍️ signature move: draws a polyline progressively, like a marker */
function marker(c,pts,prog,col,lw=2.4){
  if(prog<=0||pts.length<2)return;
  let total=0;const seg=[];
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);total+=d}
  const target=total*prog;c.save();
  c.strokeStyle=col;c.lineWidth=lw;c.lineJoin='round';c.lineCap='round';c.shadowColor=col;c.shadowBlur=6;
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);let acc=0;
  for(let i=1;i<pts.length;i++){const d=seg[i-1];
    if(acc+d<=target){c.lineTo(pts[i][0],pts[i][1]);acc+=d}
    else{const r=(target-acc)/d;c.lineTo(pts[i-1][0]+(pts[i][0]-pts[i-1][0])*r,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*r);break}
  }
  c.stroke();c.restore();
}
function pathPos(pts,p){
  let total=0;const seg=[];
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);total+=d}
  const t=total*p;let acc=0;
  for(let i=0;i<seg.length;i++){
    if(acc+seg[i]>=t||i===seg.length-1){const r=seg[i]?(t-acc)/seg[i]:0;return[pts[i][0]+(pts[i+1][0]-pts[i][0])*r,pts[i][1]+(pts[i+1][1]-pts[i][1])*r]}
    acc+=seg[i];
  }
  return pts[0];
}
const mrect=(c,x,y,w,h,p,col,lw)=>marker(c,[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y-1]],p,col,lw);
const mdia=(c,cx,cy,hw,hh,p,col,lw)=>marker(c,[[cx,cy-hh],[cx+hw,cy],[cx,cy+hh],[cx-hw,cy],[cx,cy-hh]],p,col,lw);
function mbox(c,x,y,w,h,p,col,fa=.09){
  if(p<=0)return;
  c.save();rr(c,x,y,w,h,8);c.fillStyle=rgba(col,fa*p);c.fill();c.restore();
  mrect(c,x,y,w,h,p,col,2.2);
}
function head(c,x1,y1,x2,y2,col,s=8){
  const a=Math.atan2(y2-y1,x2-x1);c.save();c.fillStyle=col;c.beginPath();c.moveTo(x2,y2);
  c.lineTo(x2-s*Math.cos(a-.42),y2-s*Math.sin(a-.42));c.lineTo(x2-s*Math.cos(a+.42),y2-s*Math.sin(a+.42));c.closePath();c.fill();c.restore();
}
function arrow(c,pts,p,col,lw=2.2){
  marker(c,pts,p,col,lw);
  if(p>=.98){const n=pts.length;head(c,pts[n-2][0],pts[n-2][1],pts[n-1][0],pts[n-1][1],col)}
}
function dash(c,pts,col,lw=1.6,a=1){
  c.save();c.globalAlpha=a;c.strokeStyle=col;c.lineWidth=lw;c.setLineDash([6,5]);c.beginPath();
  pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();c.restore();
}
function dot(c,x,y,r,col,label){
  c.save();c.shadowColor=col;c.shadowBlur=12;c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.restore();
  if(label)txt(c,label,x,y+.5,{size:Math.max(9,r*.95),col:'#07070d',weight:900,font:'mono'});
}
let CW=0;   // current canvas width, set every frame by the master loop
function txt(c,s,x,y,o={}){
  const{size=13,col=CL.chalk,weight=700,align='center',a=1,font='ui',base='middle'}=o;
  if(!s||!(a>0))return;
  c.save();c.globalAlpha=a;c.font=`${weight} ${size}px ${FONTS[font]}`;
  if(font==='mono'&&'letterSpacing' in c)c.letterSpacing='.3px';   // switches off <= << ligatures
  const w=c.measureText(s).width;
  let ax=align==='center'?x-w/2:align==='right'?x-w:x;
  if(CW)ax=Math.max(12,Math.min(ax,CW-12-w));      // keep every label inside the canvas

}
/** chalkboard surface: dark + dot grid + breathing brand-gradient frame */
function board(c,W,H,o={}){
  const p=6,x=p,y=p,w=W-p*2,h=H-p*2;
  rr(c,x,y,w,h,16);c.fillStyle=CL.board;c.fill();
  c.save();rr(c,x,y,w,h,16);c.clip();c.fillStyle='rgba(168,85,247,.055)';
  for(let gx=x+22;gx<x+w;gx+=26)for(let gy=y+22;gy<y+h;gy+=26){c.beginPath();c.arc(gx,gy,1,0,7);c.fill()}
  c.restore();
  const g=c.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,CL.indigo);g.addColorStop(.5,CL.violet);g.addColorStop(1,CL.pink);
  c.save();c.strokeStyle=g;c.lineWidth=2;c.shadowColor=CL.violet;c.shadowBlur=10+5*Math.sin((o.frame||0)*.03);
  rr(c,x,y,w,h,16);c.stroke();c.restore();
  if(o.title)txt(c,o.title,x+22,y+28,{size:16,col:CL.chalk,align:'left',font:'marker',weight:600});
  return{x,y,w,h};
}

/** trace table (chalk style). Rows appear one by one; changed cells flash. */
function table(c,x,y,w,cols,rows,f,o={}){
  const{rowH=44,hdrH=36,start=14,per=60,col=PC}=o;
  const hp=at(f,start-10,start+24);
  c.save();rr(c,x,y,w,hdrH,8);c.fillStyle=rgba(col,.16*ease(hp));c.fill();c.restore();
  let cx=x;
  cols.forEach(cd=>{const cw=cd.w*w;
    txt(c,cd.h,cd.al==='left'?cx+12:cx+cw/2,y+hdrH/2,{size:11.5,col:col,weight:800,align:cd.al==='left'?'left':'center',a:ease(hp)});
    cx+=cw});
  marker(c,[[x,y+hdrH],[x+w,y+hdrH]],hp,col,1.6);
  const first=start+30;
  rows.forEach((row,r)=>{
    const s0=first+r*per,p=at(f,s0,s0+24),ry=y+hdrH+8+r*rowH;
    if(p<=0)return;
    const active=f>=s0&&f<s0+per;
    c.save();c.globalAlpha=ease(p);
    if(active){rr(c,x,ry,w,rowH-4,8);c.fillStyle=rgba(col,.10);c.fill();c.strokeStyle=rgba(col,.55);c.lineWidth=1.4;c.stroke()}
    let cx2=x;
    row.forEach((cell,i)=>{
      const cd=cols[i],cw=cd.w*w,o2=typeof cell==='string'?{t:cell}:cell;
      if(o2.hl&&active){c.fillStyle=rgba(o2.col||col,.24);rr(c,cx2+3,ry+3,cw-6,rowH-10,6);c.fill()}
      txt(c,o2.t,cd.al==='left'?cx2+12:cx2+cw/2,ry+(rowH-4)/2,{size:cd.size||13,col:o2.col||CL.chalk,weight:o2.hl?800:600,align:cd.al==='left'?'left':'center',font:cd.mono?'mono':'ui'});
      cx2+=cw;
    });
    c.restore();
  });
  return Math.max(-1,Math.min(rows.length-1,Math.floor((f-first)/per)));
}

/** terminal that types out the expected console I/O */
function terminal(c,x,y,w,h,f,lines,o={}){
  const{start=26,speed=.5,pause=18,title='Expected output'}=o;
  const p=ease(at(f,0,30));
  c.save();c.globalAlpha=p;
  rr(c,x,y,w,h,14);c.fillStyle='#0b0b14';c.fill();
  c.save();rr(c,x,y,w,h,14);c.clip();c.fillStyle='rgba(255,255,255,.05)';c.fillRect(x,y,w,36);c.restore();
  c.strokeStyle=rgba(PC,.6);c.lineWidth=1.6;rr(c,x,y,w,h,14);c.stroke();
  ['#fb7185','#fbbf24','#34d399'].forEach((k,i)=>{c.fillStyle=k;c.beginPath();c.arc(x+22+i*18,y+18,5,0,7);c.fill()});
  c.restore();
  txt(c,title,x+w-18,y+18,{size:11.5,col:CL.dim,align:'right',a:p});
  const lh=Math.min(32,(h-76)/lines.length);
  let t=(f-start)*speed,ly=y+34+lh*.9+12,last=null,cur=null;
  lines.forEach(seg=>{
    const len=seg.reduce((n,s)=>n+s[0].length,0);
    if(t>0){
      let budget=Math.min(len,Math.floor(t)),cx=x+22;
      seg.forEach(([tx,ck])=>{
        const part=tx.slice(0,Math.max(0,budget));budget-=tx.length;
        if(part){c.save();c.font=`500 15px ${FONTS.mono}`;if('letterSpacing' in c)c.letterSpacing='.3px';c.fillStyle=CL[ck]||CL.chalk;c.textAlign='left';c.textBaseline='middle';c.fillText(part,cx,ly);cx+=c.measureText(part).width;c.restore()}
      });
      last=[cx,ly];
      if(t<len+pause*speed)cur=[cx,ly];
    }
    t-=len+pause*speed;ly+=lh;
  });
  const cp=cur||last;
  if(cp&&Math.floor(f/24)%2===0){c.fillStyle=PC;c.fillRect(cp[0]+3,cp[1]-9,9,18)}
}

/* ═══════════════ Visual registry ═══════════════ */
const VIZ={};

/* hero — drifting C++ tokens */
VIZ.tokens={cycle:100000,draw(c,W,H,f){
  const T=['if','for','def','in','return','print()','%','while','input()','range()','len()','elif','==','and','or','not','int()','True'];
  T.forEach((t,i)=>{
    const sx=((i*137.5)%100)/100,sy=((i*61.8)%100)/100;
    const x=W*sx+Math.sin(f*.01+i)*18,y=(((H*sy-f*(.12+(i%4)*.05))%H)+H)%H;
    txt(c,t,x,y,{size:15+(i%3)*4,col:i%2?PC:PC2,a:.1+.08*Math.sin(f*.02+i),font:'mono',weight:700});
  });
}};


/* ═══════════════ Python helpers ═══════════════ */
const PYC={k:null,t:'#67e8f9',s:'#34d399',n:'#fbbf24',c:'#6b6b85',p:'#a855f7',f:'#a5b4fc','':'#eef0ff'};
function pyTok(src){
  const re=/(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(\d+(?:\.\d+)?j?)\b|\b(def|return|if|elif|else|for|while|in|and|or|not|break|continue|import|from|pass|lambda)\b|\b(True|False|None)\b|\b(int|str|float|bool|list|set|dict|tuple|complex|range|frozenset|bytes|bytearray|memoryview)\b(?!\()|\b([A-Za-z_]\w*)(?=\()/g;
  const out=[];let last=0,m;
  while((m=re.exec(src))){
    if(m.index>last)out.push([src.slice(last,m.index),'']);
    const cls=m[1]?'c':m[2]?'s':m[3]?'n':m[4]?'k':m[5]?'p':m[6]?'t':'f';
    out.push([m[0],cls]);last=m.index+m[0].length;
  }
  if(last<src.length)out.push([src.slice(last),'']);
  return out;
}
/** typed, syntax-coloured code lines on the canvas */
function drawCode(c,x,y,lines,o={}){
  const{size=13,lh=24,f=1e9,start=0,per=30,active=null,a=1}=o;
  c.save();c.font=`500 ${size}px ${FONTS.mono}`;if('letterSpacing' in c)c.letterSpacing='.3px';
  c.textAlign='left';c.textBaseline='middle';
  lines.forEach((ln,i)=>{
    const p=at(f,start+i*per,start+i*per+per*.9);if(p<=0||!ln)return;
    let n=Math.ceil(ln.length*p),cx=x;
    c.globalAlpha=a*((active&&!active.includes(i))?.4:1);
    for(const[t,cl]of pyTok(ln)){
      if(n<=0)break;const part=t.slice(0,n);n-=t.length;
      c.fillStyle=cl==='k'?PC:PYC[cl];c.fillText(part,cx,y+i*lh);cx+=c.measureText(part).width;
    }
  });
  c.restore();
}
function pill(c,x,y,w,h,label,col,p=1,o={}){
  if(p<=0)return;c.save();c.globalAlpha=p;rr(c,x,y,w,h,h/2);c.fillStyle=rgba(col,o.fa??.16);c.fill();c.strokeStyle=col;c.lineWidth=1.6;c.stroke();c.restore();
  txt(c,label,x+w/2,y+h/2,{size:o.size||12,font:o.font||'mono',col:o.tc||CL.chalk,a:p,weight:700});
}
/** editor / terminal window drawn on the canvas */
function edPanel(c,x,y,w,h,name,p=1,o={}){
  if(p<=0)return;const a=Math.min(1,p),acc=o.acc||CL.violet;
  c.save();c.globalAlpha=a;
  rr(c,x,y,w,h,12);c.fillStyle='#0b0b14';c.fill();
  c.save();rr(c,x,y,w,h,12);c.clip();c.fillStyle='rgba(255,255,255,.05)';c.fillRect(x,y,w,30);c.fillStyle=rgba(acc,.6);c.fillRect(x,y+30,w,1.5);c.restore();
  c.strokeStyle='rgba(255,255,255,.13)';c.lineWidth=1.2;rr(c,x,y,w,h,12);c.stroke();
  ['#fb7185','#fbbf24','#34d399'].forEach((k,i)=>{c.fillStyle=k;c.beginPath();c.arc(x+16+i*14,y+15,4,0,7);c.fill()});
  c.restore();
  txt(c,name,x+w-16,y+15,{size:11,font:'mono',col:CL.dim,align:'right',a,weight:600});
}
/** code editor on the left (with line numbers), terminal on the right; rows typed one by one */
function codeout(c,b,f,spec){
  const{rows,note,per=46,start=16,size=13,lh=26,file='main.py'}=spec;
  const lx=b.x+22,ly=b.y+50,lw=Math.round(b.w*.56),rx=lx+lw+14,rw=b.x+b.w-22-rx,ph=Math.min(b.h-(note?100:80),30+36+rows.length*lh);
  edPanel(c,lx,ly,lw,ph,file,at(f,0,30),{acc:CL.violet});edPanel(c,rx,ly,rw,ph,'terminal',at(f,0,30),{acc:CL.green});
  rows.forEach((r,i)=>{
    const t0=start+i*per,y=ly+30+26+i*lh;
    if(f>=t0&&f<t0+per&&(r.c||r.o)){c.save();rr(c,lx+6,y-lh/2+2,lw+rw+8,lh-2,6);c.fillStyle=rgba(PC,.10);c.fill();c.restore()}
    txt(c,String(i+1),lx+32,y,{size:size-2,font:'mono',col:'#4b4b66',align:'right',a:ease(at(f,10,40))});
    if(r.c)drawCode(c,lx+46,y,[r.c],{f,start:t0,per:per*.8,size});
    if(r.o!=null){const op=at(f,t0+per*.75,t0+per*.75+24);
      txt(c,typed(r.o,op),rx+18,y,{size,font:'mono',col:CL.green,align:'left',weight:600,a:op>0?1:0})}
  });
  if(note){const tn=start+rows.length*per;txt(c,note,b.x+b.w/2,b.y+b.h-24,{size:13.5,col:PC,font:'marker',a:ease(at(f,tn,tn+30))})}
}

/* 2 — roadmap */
VIZ.pyroad={cycle:720,draw(c,W,H,f,frame){

/* 4 — input() returns a string */
VIZ.pyinput={cycle:680,draw(c,W,H,f,frame){
  const b=board(c,W,H,{title:'input() always returns a string',frame});
  const nw=160,nh=46,x0=b.x+34,gap=(b.w-68-4*nw)/3,X=i=>x0+i*(nw+gap);

    nodes.forEach((n,i)=>{
      const p=at(f,t0+i*30,t0+i*30+30);
      mbox(c,X(i),y,nw,nh,p,n[1],.13);
      txt(c,n[0],X(i)+nw/2,y+nh/2,{size:12,font:'mono',a:ease(at(f,t0+i*30+20,t0+i*30+45))});
      if(i<nodes.length-1)arrow(c,[[X(i)+nw,y+nh/2],[X(i+1),y+nh/2]],at(f,t0+i*30+20,t0+i*30+45),CL.dim,1.8);
    });
  };
  const y1=b.y+86,y2=b.y+214;

function widgetHTML(k){
  const W=WIDGETS[k];
  const st=W.vars.map((v,i)=>`<div class="st"><div class="stn">${v.n}</div><button data-w="${i}" data-d="-1" tabindex="-1" aria-label="decrease ${v.n}">−</button><b class="stv" data-v="${i}">${v.v}</b><button data-w="${i}" data-d="1" tabindex="-1" aria-label="increase ${v.n}">+</button></div>`).join('');

}
function widgetRender(el,flash){
  const k=el.dataset.wk,W=WIDGETS[k],vals=[...el.querySelectorAll('.stv')].map(e=>+e.textContent);
  const pv=v=>v<0?`(${v})`:v;
  const sub=s=>s.replace(/\bx\b/g,pv(vals[0])).replace(/\by\b/g,pv(vals[1]));
  const out=el.querySelector('.wg-out');
  out.innerHTML=W.rows.map(([op,nm,ex,fn])=>{
    const r=fn(...vals);let res;
    if(W.logic){const[parts,join,fin]=r;res=`<span class="pp">${parts.map(pyb).join(join)}</span><span class="${fin?'ok':'bad'}">${pyb(fin)}</span>`}
    else if(W.bool)res=`<span class="${r?'ok':'bad'}">${pyb(r)}</span>`;
    else res=`<span class="${r===ERR?'err':''}">${r}</span>`;
    return `<div class="wr${W.logic?' l3':''}${flash?' flash':''}"><span class="op">${op}</span><span class="wn">${nm}</span><code class="we">${W.logic?sub(ex):sub(ex)}${W.logic?'':''}</code><b class="wres">${res}</b></div>`;
  }).join('');
}

  let s;
  if(small){
    const aw=rot?H:W,ah=rot?W:H,dh=619,s0=ah/dh,dw=Math.min(1500,Math.max(1100,aw/s0));
    s=Math.min(s0,aw/dw);
    vp.style.width=dw+'px';deck.style.width=dw+'px';deck.style.height=dh+'px';
    fitbox.style.width=(rot?dh*s:dw*s)+'px';fitbox.style.height=(rot?dw*s:dh*s)+'px';
    deck.style.transform=rot?`translate(${dh*s}px,0) rotate(90deg) scale(${s})`:`scale(${s})`;
  }else{
    s=Math.min((W-12)/1100,(H-12)/707);
    vp.style.width='1100px';deck.style.width='1100px';deck.style.height='707px';
    fitbox.style.width=1100*s+'px';fitbox.style.height=707*s+'px';deck.style.transform=`scale(${s})`;
  }
  SC=Math.max(.2,s);
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));
if(window.visualViewport)visualViewport.addEventListener('resize',layout);layout();

/* ═══════════════ Ambient aurora + master loop ═══════════════ */
const amb=fit(document.getElementById('amb'));
const blobs=[[.2,.3,'#6366f1'],[.75,.25,'#a855f7'],[.55,.75,'#ec4899'],[.15,.8,'#6366f1']];
const specks=Array.from({length:46},(_,i)=>[(i*.6180339)%1,(i*.3819661+.17)%1,i*1.7]);
function aurora(f){
  amb.rs();const{ctx,W,H}=amb;if(!W)return;
  ctx.fillStyle='#07070d';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
  blobs.forEach(([bx,by,col],i)=>{
    const x=W*bx+Math.sin(f*.004+i)*70,y=H*by+Math.cos(f*.003+i*1.7)*50,r=Math.min(W,H)*(.42+.05*Math.sin(f*.006+i));
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col+'22');g.addColorStop(1,col+'00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  });
  ctx.globalCompositeOperation='source-over';
  specks.forEach(([dx,dy,ph])=>{ctx.fillStyle=`rgba(200,190,255,${.18+.18*Math.sin(f*.02+ph)})`;ctx.beginPath();ctx.arc(dx*W,dy*H,1.1,0,7);ctx.fill()});
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
  v.addColorStop(0,'rgba(5,5,9,0)');v.addColorStop(1,'rgba(5,5,9,.7)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function tick(){
  frame++;aurora(frame);
  for(const o of live){
    if(o.slide!==cur)continue;
    o.s.rs();const{ctx,W,H}=o.s;if(!W)continue;
    ctx.clearRect(0,0,W,H);CW=W;
    o.def.draw(ctx,W,H,(frame-t0)%o.def.cycle,frame,o);
  }
  requestAnimationFrame(tick);
}
go(0);tick();
const bt=document.getElementById('boot');if(bt)bt.remove();
window.__go=go;

<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multimedia — Session ⇔ 02 · Object-Oriented Programming (OOP) in Python</title>
<meta name="description" content="Multimedia Course — Session 02: Object-Oriented Programming in Python by Eng. Muhammad Ali Abdul Kareem, Sinai University.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  try {
    var t = localStorage.getItem('cs:theme') || localStorage.getItem('deck_theme');
    if (t === 'light') document.documentElement.classList.add('light-mode');
  } catch(e){}
</script>
<style>
:root{
  color-scheme:dark;
  --c:#ec4899; --c-2:#a855f7;
  --c-grad:linear-gradient(90deg,var(--c),var(--c-2));
  --bg:#07070d; --stage-bg:#090912; --card:rgba(18,18,28,.82); --border:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.08);
  --tp:#f0eeff; --ts:#9a9ab5; --tm:#6b6b85; --warn:#fb7185;
  --syntax-grad:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}

/* Light Theme Tokens */
html.light-mode, body.light-mode, html.light-mode body{
  color-scheme: light;
  --bg:#ebe9f5;
  --stage-bg:#ffffff;
  --card:#ffffff;
  --card-border:rgba(120,110,160,.16);
  --border:rgba(120,110,160,.16);
  --tp:#181528;
  --ts:#524d70;
  --tm:#7f789e;
  --warn:#e11d48;
  --syntax-grad:linear-gradient(135deg,#4f46e5,#9333ea,#db2777);
  --shadow-vp:0 24px 60px rgba(100,90,140,.14);
}

body.light-mode .vp.part-intro, html.light-mode body .vp.part-intro{--c:#db2777;--c-2:#9333ea}
body.light-mode .vp.part-warm, html.light-mode body .vp.part-warm{--c:#2563eb;--c-2:#3b82f6}
body.light-mode .vp.part-class, html.light-mode body .vp.part-class{--c:#4f46e5;--c-2:#7c3aed}
body.light-mode .vp.part-meth, html.light-mode body .vp.part-meth{--c:#0891b2;--c-2:#0284c7}
body.light-mode .vp.part-props, html.light-mode body .vp.part-props{--c:#d97706;--c-2:#b45309}
body.light-mode .vp.part-inh, html.light-mode body .vp.part-inh{--c:#059669;--c-2:#10b981}
body.light-mode .vp.part-poly, html.light-mode body .vp.part-poly{--c:#db2777;--c-2:#e11d48}
body.light-mode .vp.part-encap, html.light-mode body .vp.part-encap{--c:#9333ea;--c-2:#a855f7}

body.light-mode .vp, html.light-mode body .vp{
  background:var(--stage-bg);
  box-shadow:0 0 0 1px rgba(168,85,247,.12),0 24px 60px rgba(100,90,140,.14);
}
body.light-mode .slide-counter{background:rgba(255,255,255,.88);border-color:var(--border);color:var(--ts);backdrop-filter:blur(8px)}
body.light-mode .vp-progress{background:rgba(120,110,160,.12)}
body.light-mode .dot{background:rgba(120,110,160,.25)}
body.light-mode code{color:#6b21a8;background:rgba(120,110,160,.12)}
body.light-mode .chips span{background:rgba(255,255,255,.75);border-color:var(--border);color:var(--ts)}
body.light-mode .chip{background:rgba(255,255,255,.85);border-color:var(--border);color:var(--c)}
body.light-mode .trap{background:rgba(225,29,72,.07);border-color:rgba(225,29,72,.28);color:var(--tp)}
body.light-mode .q{background:#ffffff;border-color:var(--c);box-shadow:0 8px 24px rgba(100,90,140,.08)}
body.light-mode .solbtn{background:rgba(255,255,255,.9);color:var(--tp)}
body.light-mode .solbtn:hover{background:var(--c);color:#ffffff}
body.light-mode .sol{background:rgba(245,244,252,.98);backdrop-filter:blur(12px)}
body.light-mode .sol .note{background:#ffffff;border-color:var(--border);border-left-color:var(--c);color:var(--tp);box-shadow:0 4px 14px rgba(100,90,140,.06)}
body.light-mode .codecard{background:#13111f;border-color:rgba(120,110,160,.2);box-shadow:0 14px 34px rgba(50,40,90,.15)}
body.light-mode .ed-bar{background:rgba(255,255,255,.04)}
body.light-mode .stp{background:rgba(255,255,255,.65);border-color:var(--border)}
body.light-mode .stp.on{background:#ffffff;border-color:var(--c);box-shadow:0 4px 16px rgba(100,90,140,.1)}
body.light-mode .stp i{color:#ffffff}
body.light-mode .ansbtn{background:rgba(255,255,255,.9);color:var(--tp)}
body.light-mode .ansbtn:hover{background:var(--c);color:#ffffff}
body.light-mode .ansmodal{background:rgba(15,12,30,.45);backdrop-filter:blur(4px)}
body.light-mode .ans-card{background:#ffffff;border-color:rgba(168,85,247,.4);color:#181528;box-shadow:0 20px 60px rgba(50,40,90,.2)}
body.light-mode .ans-row{background:#f4f2fb;border-color:rgba(120,110,160,.2)}
body.light-mode .ans-row span{color:#524d70}
body.light-mode .ans-row input{color:#059669}
body.light-mode .ans-btns button.ghost{color:#524d70;border-color:rgba(120,110,160,.25)}
body.light-mode .controls button{background:rgba(255,255,255,.85);border-color:var(--border);color:var(--ts)}
body.light-mode .controls button:hover{background:#ffffff;color:var(--tp);border-color:var(--c)}
body.light-mode .controls kbd{background:rgba(120,110,160,.14);color:var(--ts)}
body.light-mode .mnav{background:rgba(255,255,255,.88);border-color:var(--border);color:var(--tp);box-shadow:0 4px 16px rgba(100,90,140,.18)}
body.light-mode .brand-left a{background:rgba(255,255,255,.8)!important;color:var(--tp)!important;border-color:var(--border)!important;}
body.light-mode .brand-left a:hover{background:#ffffff!important;border-color:var(--c)!important;}

/* Theme Toggle Button */
.theme-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--tp);transition:.2s;padding:0;
}
.theme-btn:hover{border-color:var(--c);transform:scale(1.05);}
.theme-btn svg{width:16px;height:16px;stroke-width:2;}
.brand-right{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--ts);font-weight:700}

*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--tp);font-family:Inter,system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;transition:background .3s ease, color .3s ease;}
body{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:flex;align-items:center;justify-content:center}
body.small{padding:0!important}
#fitbox{position:relative;flex:none;overflow:hidden;width:100%;height:100%;}
#deck{position:absolute;left:0;top:0;transform-origin:top left}

/* Brand Bar */
.brand-bar{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;}
.brand-left{display:flex;align-items:center;gap:11px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--syntax-grad);display:grid;place-items:center;font:800 13px var(--mono);color:#fff;letter-spacing:-1px}
.brand-name{font-size:15px;font-weight:900;background:var(--syntax-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.brand-sub{font-size:11px;color:var(--tm);font-weight:600}
.brand-right{font-size:11.5px;color:var(--ts);font-weight:700}

/* Stage Viewport */
.vp{width:1100px;height:619px;position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:var(--bg);box-shadow:0 0 0 1px rgba(168,85,247,.08),0 32px 70px rgba(0,0,0,.8)}
.vp.part-intro{--c:#ec4899;--c-2:#a855f7}
.vp.part-warm{--c:#3b82f6;--c-2:#60a5fa}
.vp.part-class{--c:#6366f1;--c-2:#8b5cf6}
.vp.part-meth{--c:#22d3ee;--c-2:#06b6d4}
.vp.part-props{--c:#f59e0b;--c-2:#fbbf24}
.vp.part-inh{--c:#10b981;--c-2:#34d399}
.vp.part-poly{--c:#ec4899;--c-2:#f43f5e}
.vp.part-encap{--c:#a855f7;--c-2:#c084fc}

.vp-bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.vp-progress{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.05);z-index:6}
.vp-progress span{display:block;height:100%;width:0;background:var(--syntax-grad);box-shadow:0 0 12px #a855f7;border-radius:0 3px 3px 0;transition:width .45s ease}
.slide-counter{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;padding:5px 14px;border-radius:999px;background:rgba(12,12,20,.75);border:1px solid var(--border);font-size:12px;font-weight:800;color:var(--ts)}

/* Slides */
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:46px 52px 40px;z-index:2}
.slide.active{display:flex}
.slide>*{animation:revealUp .6s ease both}
.slide>*:nth-child(2){animation-delay:.08s}
.slide>*:nth-child(3){animation-delay:.16s}
.slide>*:nth-child(4){animation-delay:.24s}
.slide>*:nth-child(5){animation-delay:.32s}
@keyframes revealUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.lbl{font-size:12.5px;font-weight:800;color:var(--c);margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase}
h2{margin:0 0 6px;font-size:27px;font-weight:900;line-height:1.3;letter-spacing:-.3px}
h2 em{font-style:normal;background:var(--c-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;font-size:14.5px;color:var(--ts);line-height:1.6;max-width:860px}
.sub strong{color:var(--tp)}
code,pre.code{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
code{font-family:var(--mono);font-size:.92em;color:#c7b3ff;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px}
.stage{flex:1;position:relative;min-height:0;margin-top:10px}
.viz{position:absolute;inset:0}
.viz canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Footer */
.sf{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--tm);font-weight:600;margin-top:10px;height:16px}
.pd{display:flex;gap:4px;align-items:center}
.dot{width:5px;height:5px;border-radius:99px;background:rgba(255,255,255,.14);transition:.3s}
.dot.on{width:18px;background:var(--c-grad)}

/* Hero Slide */
.hero-slide{justify-content:center}
.hero-slide .lbl{margin-top:auto}
.hero-slide h1{margin:6px 0 10px;font-size:72px;line-height:1.02;font-weight:900;letter-spacing:-2px}
.hero-slide h1 em{font-style:normal;background:var(--syntax-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-slide .tag{font-size:21px;color:var(--ts);font-weight:600;max-width:780px;line-height:1.45}
.inst{display:flex;align-items:center;gap:14px;margin-top:30px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--syntax-grad);display:grid;place-items:center;font-weight:900;font-size:23px;box-shadow:0 0 24px rgba(168,85,247,.45)}
.inst small{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--tm);font-weight:800;margin-bottom:2px}
.inst b{font-size:21px;font-weight:800}
.chips{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.chips span{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04);font-size:13px;font-weight:700;color:var(--ts)}
.hero-slide .sf{margin-top:auto}
.herobg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* Tasks */
.task{display:grid;grid-template-columns:.92fr 1.08fr;gap:24px;position:absolute;inset:0}
.tleft{display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
.chip{align-self:flex-start;padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--c);font-weight:800;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase}
.req{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.req li{position:relative;padding-left:26px;font-size:15px;line-height:1.5;color:var(--tp)}
.req li::before{content:'';position:absolute;left:0;top:.42em;width:11px;height:11px;border-radius:3px;background:var(--c-grad)}
.tright{position:relative;min-height:0}
.solbtn{position:absolute;top:30px;right:52px;z-index:7;cursor:pointer;padding:8px 16px;border-radius:999px;border:1px solid var(--c);background:rgba(12,12,20,.85);color:var(--tp);font:800 12.5px Inter,system-ui,sans-serif;letter-spacing:.3px}
.solbtn:hover{background:var(--c);color:#07070d}
.solbtn kbd{margin-left:6px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.1);font:700 11px var(--mono)}

/* Solutions Modal Panel */
.sol{display:none;position:absolute;inset:0;background:#07070d;padding:30px 48px 36px;z-index:8;flex-direction:column;gap:12px}
.sol.open{display:flex}
.sol-h{display:flex;justify-content:space-between;align-items:center}
.sol-h .lbl{margin:0;font-size:13px}
.sol-body{display:grid;grid-template-columns:2.1fr 0.9fr;gap:22px;flex:1;min-height:0;align-items:center}
.notes{display:flex;flex-direction:column;gap:12px;justify-content:center}
.note-h{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--tm)}
.note{padding:12px 15px;border-radius:12px;border:1px solid var(--border);border-left:3px solid var(--c);background:rgba(255,255,255,.03);font-size:13.5px;line-height:1.55}

/* Code Windows */
.codecard{background:#0b0b14;border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:0;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.45);width:100%}
.ed-bar{display:flex;align-items:center;gap:6px;padding:9px 14px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--c)}
.ed-bar i{width:9px;height:9px;border-radius:50%;display:block;flex:none}
.ed-file{margin-left:10px;font:600 11.5px var(--mono);color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.ed-lang{font:800 10px Inter,system-ui,sans-serif;letter-spacing:.9px;text-transform:uppercase;color:var(--c)}
.cp-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--ts);font:600 10.5px Inter,system-ui,sans-serif;padding:3px 8px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:.2s}
.cp-btn:hover{background:var(--c);color:#07070d;border-color:var(--c)}
.ed-body{padding:14px 16px;overflow-x:auto}
pre.code{margin:0;font:500 12.5px/1.55 var(--mono);color:#e8e6ff;white-space:pre;tab-size:4;counter-reset:ln}
pre.code .ln{counter-increment:ln;display:block;padding:1px 6px;margin:0 -6px;border-radius:4px;opacity:1}
pre.code .ln::before{content:counter(ln);display:inline-block;width:2ch;margin-right:14px;text-align:right;color:#4b4b66;user-select:none}
pre.code .k{color:var(--c);font-weight:700}
pre.code .t{color:#67e8f9}
pre.code .s{color:#34d399}
pre.code .n{color:#fbbf24}
pre.code .c{color:#6b6b85;font-style:italic}
pre.code .p{color:#a855f7}
pre.code .f{color:#a5b4fc}
pre.code .o{color:#f9a8d4}

/* Walkthroughs */
.walk{display:grid;grid-template-columns:1.58fr 1fr;gap:20px;position:absolute;inset:0;grid-template-rows:minmax(0,1fr)}
.walk .codecard{max-height:100%;overflow:hidden;align-self:center;display:block;padding:0}
.walk pre.code .ln{opacity:.45}
.walk pre.code .ln.on{opacity:1;background:rgba(255,255,255,.08);box-shadow:inset 3px 0 0 var(--c)}
.steps{display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0}
.stp{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.02);cursor:pointer;opacity:.5;transition:opacity .25s,border-color .25s,background .25s}
.stp.on{opacity:1;border-color:var(--c);background:rgba(255,255,255,.06)}
.stp i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--c-grad);color:#07070d;font:900 12px Inter,system-ui,sans-serif;font-style:normal;display:grid;place-items:center;margin-top:1px}
.stp b{display:block;font-size:14px;margin-bottom:3px}
.stp code{white-space:pre}
.stp span b{display:inline;font-size:inherit;margin:0;color:var(--tp)}
.stp span{font-size:12.5px;color:var(--ts);line-height:1.5;display:block}
.walk.dense .stp{padding:7px 12px}
.walk.dense .steps{gap:7px}
.walk.dense .stp b{font-size:13.5px;margin-bottom:1px}
.walk.dense .stp span{font-size:12.5px}

/* Challenge */
.chal{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;position:absolute;inset:0}
.chal .col{display:flex;flex-direction:column;gap:14px;min-height:0}
.chal .codecard{flex:none;align-self:center}
.q{padding:16px 18px;border-radius:14px;border:1px solid var(--c);background:rgba(255,255,255,.03);flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.q b{font-size:18px}
.q .term{font:600 16px var(--mono);color:var(--ts);cursor:pointer;min-height:24px}
.q .term .typed{color:var(--tp)}
.q .term i{display:inline-block;width:9px;height:18px;background:var(--c);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ansbtn{align-self:flex-start;cursor:pointer;padding:9px 18px;border-radius:999px;border:1px solid var(--c);background:rgba(255,255,255,.05);color:var(--tp);font:800 13.5px Inter,system-ui,sans-serif}
.ansbtn:hover{background:var(--c);color:#07070d}
.ansbtn kbd{margin-left:8px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.12);font:700 11px var(--mono)}

/* Modal */
.ansmodal{position:fixed;inset:0;z-index:100;display:flex;justify-content:center;align-items:flex-start;padding:8vh 12px 12px;background:rgba(5,5,10,.78)}
.ansmodal[hidden]{display:none}
.ans-card{width:min(94vw,480px);background:#0b0b14;border:1px solid rgba(168,85,247,.65);border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.7);font-family:Inter,system-ui,sans-serif;color:#f0eeff}
.ans-h{font-weight:800;font-size:16px;margin-bottom:12px}
.ans-row{display:flex;align-items:center;gap:8px;background:#05050a;border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.ans-row span{font:700 16px "JetBrains Mono",ui-monospace,monospace;color:#9a9ab5}
.ans-row input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#34d399;font:600 16px "JetBrains Mono",ui-monospace,monospace}
.ans-fb{font-size:13.5px;line-height:1.55;margin-top:12px;min-height:0}
.ans-fb.ok{color:#34d399}.ans-fb.bad{color:#fb7185}
.ans-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ans-btns button{cursor:pointer;padding:9px 16px;border-radius:999px;border:1px solid rgba(168,85,247,.6);background:linear-gradient(90deg,#6366f1,#a855f7);color:#fff;font:800 13px Inter,system-ui,sans-serif}
.ans-btns button.ghost{background:transparent;color:#9a9ab5;border-color:rgba(255,255,255,.15)}

/* Controls & Mobile */
.controls{height:44px;display:flex;align-items:center;justify-content:space-between;color:var(--tm);font-size:12px;font-weight:600;padding:0 20px;}
.controls button{cursor:pointer;padding:7px 16px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--ts);font:700 12px Inter,system-ui,sans-serif}
.controls button:hover{color:var(--tp);border-color:rgba(255,255,255,.25)}
.controls kbd{padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.08);font:700 11px var(--mono);color:var(--ts)}
.mnav{display:none;position:absolute;top:50%;z-index:99;width:44px;height:44px;margin-top:-22px;border-radius:50%;border:1px solid var(--border);background:rgba(12,12,20,.75);color:var(--tp);font:800 22px/1 Inter,system-ui,sans-serif;cursor:pointer;place-items:center;padding:0;opacity:.85;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:transform .15s, opacity .15s;}
.mnav:active{transform:scale(0.92);opacity:1;}
.mnav.mp{left:8px}.mnav.mn{right:8px}
.small .mnav{display:grid}
.small .brand-bar,.small .controls{display:none}
.laser-pointer{position:fixed;width:16px;height:16px;border-radius:50%;background:#ff2a55;box-shadow:0 0 14px 5px rgba(255,42,85,.85),0 0 28px 12px rgba(255,42,85,.4);pointer-events:none;z-index:999999;transform:translate(-50%,-50%);display:none}
.laser-pointer.active{display:block}

.m-nav-hud{display:none}

/* The Creative Home Pill */
.m-pill{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;
  background:rgba(12,10,22,.68);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.12);color:#f0eeff;font:700 11px/1 Inter,system-ui,sans-serif;
  text-decoration:none;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);
  transition:transform .15s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease;
  user-select:none;
}
.m-pill:active{transform:scale(0.93)}
.m-pill-home{
  background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.22)),rgba(14,12,24,.75);

.m-pill-home .m-pill-icon svg{width:13px;height:13px;stroke:var(--c);display:block}
.m-pill-home .m-pill-text{font-weight:800;letter-spacing:.2px;background:linear-gradient(90deg,#fff,#f0eeff);-webkit-background-clip:text;background-clip:text;color:transparent}
.m-pill-spark{font-size:9px;color:var(--c);animation:pulseSpark 2.4s ease-in-out infinite}

.m-pill-cluster{display:flex;align-items:center;gap:5px}

const FONTS={ui:'Inter, system-ui, sans-serif',marker:'Lemonada, Inter, sans-serif',mono:'"JetBrains Mono", ui-monospace, Menlo, monospace'};
let PC='#ec4899',PC2='#a855f7',SC=1;
const at=(f,a,b)=>Math.min(1,Math.max(0,(f-a)/(b-a)));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};

function fit(cv){
  const ctx=cv.getContext('2d'),s={ctx,W:0,H:0,d:0},p=cv.parentElement;

  };

}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function marker(c,pts,prog,col,lw=2.4){
  if(prog<=0||pts.length<2)return;
  let total=0;const seg=[];
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);total+=d}
  const target=total*prog;c.save();

const mrect=(c,x,y,w,h,p,col,lw)=>marker(c,[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y-1]],p,col,lw);

let CW=0;
function txt(c,s,x,y,o={}){
  const{size=13,col=CL.chalk,weight=700,align='center',a=1,font='ui',base='middle'}=o;

  const w=c.measureText(s).width;
  let ax=align==='center'?x-w/2:align==='right'?x-w:x;
  if(CW)ax=Math.max(12,Math.min(ax,CW-12-w));

function board(c,W,H,o={}){
  const p=6,x=p,y=p,w=W-p*2,h=H-p*2;
  rr(c,x,y,w,h,16);c.fillStyle=CL.board;c.fill();

  c.save();c.globalAlpha=a;

/* Syntax Tokenizer */
const PYC={k:null,t:'#67e8f9',s:'#34d399',n:'#fbbf24',c:'#6b6b85',p:'#a855f7',f:'#a5b4fc','':'#eef0ff'};
function pyTok(src){
  const re=/(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(\d+(?:\.\d+)?j?)\b|\b(class|def|return|if|elif|else|for|while|in|and|or|not|break|continue|import|from|pass|lambda|del)\b|\b(True|False|None|self|super)\b|\b(int|str|float|bool|list|set|dict|tuple|range)\b(?!\()|\b([A-Za-z_]\w*)(?=\()/g;
  const out=[];let last=0,m;
  while((m=re.exec(src))){
    if(m.index>last)out.push([src.slice(last,m.index),'']);
    const cls=m[1]?'c':m[2]?'s':m[3]?'n':m[4]?'k':m[5]?'p':m[6]?'t':'f';
    out.push([m[0],cls]);last=m.index+m[0].length;
  }
  if(last<src.length)out.push([src.slice(last),'']);
  return out;
}
function drawCode(c,x,y,lines,o={}){
  const{size=13,lh=24,f=1e9,start=0,per=30,active=null,a=1}=o;

function terminal(c,x,y,w,h,f,lines,o={}){
  const{start=26,speed=.5,pause=18,title='Expected output'}=o;
  const p=ease(at(f,0,30));
  c.save();c.globalAlpha=p;
  rr(c,x,y,w,h,14);c.fillStyle=isLight?'#13111f':'#0b0b14';c.fill();
  c.save();rr(c,x,y,w,h,14);c.clip();c.fillStyle='rgba(255,255,255,.05)';c.fillRect(x,y,w,36);c.restore();
  c.strokeStyle=rgba(PC,.6);c.lineWidth=1.6;rr(c,x,y,w,h,14);c.stroke();
  ['#fb7185','#fbbf24','#34d399'].forEach((k,i)=>{c.fillStyle=k;c.beginPath();c.arc(x+22+i*18,y+18,5,0,7);c.fill()});
  c.restore();
  txt(c,title,x+w-18,y+18,{size:11.5,col:CL.edDim,align:'right',a:p});
  const lh=Math.min(32,(h-76)/lines.length);
  let t=(f-start)*speed,ly=y+34+lh*.9+12,last=null,cur=null;
  lines.forEach(seg=>{
    const len=seg.reduce((n,s)=>n+s[0].length,0);
    if(t>0){
      let budget=Math.min(len,Math.floor(t)),cx=x+22;
      seg.forEach(([tx,ck])=>{
        const part=tx.slice(0,Math.max(0,budget));budget-=tx.length;
        if(part){c.save();c.font=`500 15px ${FONTS.mono}`;if('letterSpacing' in c)c.letterSpacing='.3px';c.fillStyle=(ck==='dim')?CL.edDim:(ck&&CL[ck]&&ck!=='chalk')?CL[ck]:CL.edChalk;c.textAlign='left';c.textBaseline='middle';c.fillText(part,cx,ly);cx+=c.measureText(part).width;c.restore()}
      });
      last=[cx,ly];
      if(t<len+pause*speed)cur=[cx,ly];
    }
    t-=len+pause*speed;ly+=lh;
  });
  const cp=cur||last;
  if(cp&&Math.floor(f/24)%2===0){c.fillStyle=PC;c.fillRect(cp[0]+3,cp[1]-9,9,18)}
}

  mFsBtn.onclick = () => {
    try {
      if(document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        const el = document.documentElement;
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
    } catch(_){}
  };
}

window.addEventListener('storage', e => {
  if (e.key === 'cs:theme' || e.key === 'deck_theme') {
    setTheme(e.newValue === 'light');
  }
});

const initialTheme = (function(){
  try { return localStorage.getItem('cs:theme') || localStorage.getItem('deck_theme'); }
  catch(_) { return null; }
})();
if(initialTheme === 'light' || document.documentElement.classList.contains('light-mode')){
  setTheme(true);
} else {
  updateThemeTokens();
}

/* ═══════════════ Responsive Fitting ═══════════════ */
const fitbox=document.getElementById('fitbox'),deck=document.getElementById('deck');
function layout(){
  if(typing)return;
  const W=window.innerWidth,H=window.innerHeight;
  const small=Math.min(W,H)<768 || W<992;
  document.body.classList.toggle('small',small);
  if(!small){
    const s=Math.min((W-20)/1100,(H-24)/707);
    vp.style.width='1100px';vp.style.height='619px';
    deck.style.width='1100px';deck.style.height='707px';
    fitbox.style.width=Math.round(1100*s)+'px';fitbox.style.height=Math.round(707*s)+'px';
    deck.style.transformOrigin='top left';deck.style.transform=`scale(${s})`;
    SC=Math.max(.2,s);return;
  }
  const isLandscape=W>=H;
  let s,dw,dh;
  if(isLandscape){
    s=H/619;
    if(W/s<1100){s=W/1100;dw=1100;dh=Math.round(H/s);}
    else{dw=Math.round(W/s);dh=619;}
  }else{
    s=W/1100;dw=1100;dh=619;
  }
  vp.style.width=dw+'px';vp.style.height=dh+'px';
  deck.style.width=dw+'px';deck.style.height=dh+'px';
  fitbox.style.width=(isLandscape?W:Math.round(dw*s))+'px';
  fitbox.style.height=(isLandscape?H:Math.round(dh*s))+'px';
  deck.style.transformOrigin='top left';
  deck.style.transform=`scale(${s})`;
  SC=Math.max(.2,s);
}
addEventListener('resize',layout);
addEventListener('orientationchange',()=>setTimeout(layout,120));
if(window.screen&&window.screen.orientation){
  window.screen.orientation.addEventListener('change',()=>setTimeout(layout,120));
}
layout();

/* ═══════════════ Ambient Canvas & Master Render Loop ═══════════════ */
const amb=fit(document.getElementById('amb'));
const blobs=[[.2,.3,'#6366f1'],[.75,.25,'#a855f7'],[.55,.75,'#ec4899'],[.15,.8,'#6366f1']];
const specks=Array.from({length:46},(_,i)=>[(i*.6180339)%1,(i*.3819661+.17)%1,i*1.7]);

function aurora(f){
  amb.rs();const{ctx,W,H}=amb;if(!W)return;
  ctx.fillStyle=isLight?'#ebe9f5':'#07070d';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
  blobs.forEach(([bx,by,col],i)=>{
    const x=W*bx+Math.sin(f*.004+i)*70,y=H*by+Math.cos(f*.003+i*1.7)*50,r=Math.min(W,H)*(.42+.05*Math.sin(f*.006+i));
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col+(isLight?'15':'22'));g.addColorStop(1,col+'00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  });
  ctx.globalCompositeOperation='source-over';
  specks.forEach(([dx,dy,ph])=>{ctx.fillStyle=isLight?`rgba(90,80,140,${.12+.1*Math.sin(f*.02+ph)})`:`rgba(200,190,255,${.18+.18*Math.sin(f*.02+ph)})`;ctx.beginPath();ctx.arc(dx*W,dy*H,1.1,0,7);ctx.fill()});
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
  v.addColorStop(0,'rgba(5,5,9,0)');v.addColorStop(1,isLight?'rgba(235,233,245,.65)':'rgba(5,5,9,.7)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

let isTabVisible=true;
document.addEventListener('visibilitychange',()=>{
  isTabVisible=!document.hidden;
  if(isTabVisible)requestAnimationFrame(tick);
});
function tick(){
  if(!isTabVisible)return;
  frame++;
  const isSmall=document.body.classList.contains('small');
  if(!isSmall||frame%2===0){aurora(frame);}
  for(const o of live){
    if(o.slide!==cur)continue;
    o.s.rs();const{ctx,W,H}=o.s;if(!W)continue;
    ctx.clearRect(0,0,W,H);CW=W;
    o.def.draw(ctx,W,H,(frame-t0)%o.def.cycle,frame,o);
  }
  requestAnimationFrame(tick);
}
go(0);tick();
const bt=document.getElementById('boot');if(bt)bt.remove();
window.__go=go;
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Cosmic Gradient -->
    <radialGradient id="bgGrad" cx="32" cy="32" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141a38"/>
      <stop offset="65%" stop-color="#0a0e22"/>
      <stop offset="100%" stop-color="#050711"/>
    </radialGradient>
    
    <!-- Central Starlight Glow -->
    <radialGradient id="glow" cx="32" cy="32" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd479" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Star Core Gold Gradient -->
    <linearGradient id="goldStar" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#ffd479"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffd479" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Rounded Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#ringGrad)" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Ambient Glow Behind Stars -->
  <circle cx="32" cy="32" r="22" fill="url(#glow)"/>

  <!-- Constellation Geometric Orbit / Diamond Web -->
  <path d="M32 10 L50 26 L42 50 L22 50 L14 26 Z" stroke="rgba(168,85,247,0.35)" stroke-width="1" stroke-dasharray="2 3"/>
  <path d="M14 26 L50 26 M22 50 L32 10 M42 50 L32 10" stroke="rgba(255,212,121,0.25)" stroke-width="0.8"/>

  <!-- Outer Satellite Stars / Nodes -->
  <circle cx="32" cy="10" r="2.2" fill="#ffd479" filter="url(#softGlow)"/>
  <circle cx="50" cy="26" r="2.4" fill="#38bdf8" filter="url(#softGlow)"/>
  <circle cx="42" cy="50" r="2.2" fill="#ec4899" filter="url(#softGlow)"/>
  <circle cx="22" cy="50" r="2.2" fill="#a855f7" filter="url(#softGlow)"/>
  <circle cx="14" cy="26" r="2.4" fill="#34d399" filter="url(#softGlow)"/>

  <!-- Little ambient twinkling dust -->
  <circle cx="20" cy="16" r="1" fill="#fff" opacity="0.65"/>
  <circle cx="46" cy="40" r="1.1" fill="#ffd479" opacity="0.7"/>
  <circle cx="26" cy="38" r="0.9" fill="#fff" opacity="0.6"/>

  <!-- Main 8-Point Cosmic Constella Star -->
  <!-- Diagonal subtle flares -->
  <path d="M32 23 L34 30 L41 32 L34 34 L32 41 L30 34 L23 32 L30 30 Z" fill="#ffd479" opacity="0.65" transform="rotate(45 32 32)"/>
  <!-- Primary Cardinal 4-Point Star -->
  <path d="M32 15 C32 26 33 31 38 31 C40.5 31 46 31.5 49 32 C46 32.5 40.5 33 38 33 C33 33 32 38 32 49 C32 38 31 33 26 33 C23.5 33 18 32.5 15 32 C18 31.5 23.5 31 26 31 C31 31 32 26 32 15 Z" 
        fill="url(#goldStar)" filter="url(#softGlow)"/>

  <!-- Sparkling Pure White Core -->
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>
</svg>
